<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <title>论文 PDF</title>
    <link rel="stylesheet" href="viewer.css?v=20260917-questions">
    <script>
      (() => {
        const embedded = new URLSearchParams(location.search).get("embedded") === "1";
        const root = document.documentElement;
        if (embedded) root.classList.add("reader-embedded");
        const preference = matchMedia("(prefers-color-scheme: dark)");
        let siteBody;
        try { if (embedded) siteBody = window.parent.document.body; } catch (_) {}
        const syncTheme = () => {
          const scheme = siteBody?.getAttribute("data-md-color-scheme");
          root.dataset.readerTheme = (scheme ? scheme === "slate" : preference.matches) ? "dark" : "light";
        };
        syncTheme();
        preference.addEventListener("change", syncTheme);
        if (siteBody) new MutationObserver(syncTheme).observe(siteBody, { attributes: true, attributeFilter: ["data-md-color-scheme"] });
      })();
    </script>
  </head>
  <body>
    <header class="toolbar" aria-label="PDF 工具栏">
      <div class="toolbar-group page-tools">
        <button id="previous" class="page-step" type="button" title="上一页" aria-label="上一页">←</button>
        <label class="page-control">
          <span class="visually-hidden">当前页</span>
          <span aria-hidden="true">第</span>
          <input id="page-number" type="number" min="1" value="1">
          <span>/ <span id="page-count">-</span> 页</span>
        </label>
        <button id="next" class="page-step" type="button" title="下一页" aria-label="下一页">→</button>
      </div>
      <span class="divider"></span>
      <div class="toolbar-group zoom-tools">
        <button id="zoom-out" type="button" title="缩小" aria-label="缩小">−</button>
        <button id="fit-width" type="button" title="适合宽度">适宽</button>
        <button id="zoom-in" type="button" title="放大" aria-label="放大">＋</button>
        <span id="zoom-label" class="zoom-label">100%</span>
      </div>
      <span class="divider"></span>
      <div class="toolbar-group translation-tools">
        <button id="insight-toggle" type="button" title="打开知识解析" aria-expanded="false" aria-controls="insight-panel" disabled>解析</button>
        <button id="translation-toggle" type="button" class="translation-toggle" title="打开中文译文" aria-pressed="false">译文</button>
      </div>
      <button id="text-mode" type="button" aria-pressed="false" title="切换文字选择与拖动浏览">选择文字</button>
      <button id="search-toggle" type="button" aria-expanded="false" aria-controls="pdf-search">查找</button>
      <span class="toolbar-spacer"></span>
      <a id="open-original" target="_blank" rel="noopener">原始 PDF</a>
    </header>
    <form id="pdf-search" class="pdf-search" hidden>
      <input id="search-query" type="search" placeholder="搜索 PDF 原文" aria-label="搜索 PDF 原文">
      <button type="submit">查找</button><button id="search-previous" type="button" aria-label="上一个匹配">↑</button><button id="search-next" type="button" aria-label="下一个匹配">↓</button>
      <span id="search-status" role="status" aria-live="polite"></span><button id="search-close" type="button" aria-label="关闭查找">×</button>
    </form>
    <div id="pdf-selection-actions" class="pdf-selection-actions" hidden><button id="copy-selection" type="button">复制原文</button><button id="ask-selection" type="button">用选中内容提问</button><span role="status"></span></div>
    <button id="expand-comparison" type="button" hidden>PDF 空间较窄，展开原文与译文对照</button>
    <div id="workspace" class="workspace">
      <main id="viewport" class="viewport">
        <div id="status" class="status">正在载入 PDF…</div>
        <div id="pages" class="pages" aria-label="PDF 连续页面"></div>
      </main>
      <button id="insight-resizer" class="translation-resizer" type="button" role="separator" aria-label="拖动调整原文 PDF 与知识解析宽度；双击恢复默认" aria-orientation="vertical" title="拖动调整宽度；双击恢复默认" hidden></button>
    <section id="insight-panel" class="insight-panel" aria-label="当前 PDF 页知识解析" hidden>
      <header class="insight-header">
        <div class="companion-intro"><span>读懂动机 · 分清结论</span><strong id="insight-title">知识解析</strong><p>讲明这一页为什么这样做、证据说明到哪一步；推导细节按需展开。</p></div>
        <details class="insight-options"><summary>解析设置</summary><div class="insight-settings">
          <label><span>模型名称</span><select id="insight-model" aria-label="解析模型" title="解析模型"></select></label>
          <label><span>推理强度</span><select id="insight-effort" aria-label="解析推理强度" title="解析推理强度"></select></label>
        </div>
        </details>
        <button id="generate-insight" type="button">解析本页知识</button>
        <button id="close-insight" class="insight-close" type="button" title="收起解析" aria-label="收起解析">×</button>
      </header>
      <div id="insight-status" class="insight-status" role="status" aria-live="polite">尚未生成</div>
      <div id="insight-content" class="insight-content"></div>
    </section>
      <button id="translation-resizer" class="translation-resizer" type="button" role="separator" aria-label="拖动调整原文 PDF 与中文译文宽度；双击恢复默认" aria-orientation="vertical" hidden></button>
      <section id="translation-panel" class="translation-panel" aria-label="当前 PDF 页译文" hidden>
        <header class="translation-header">
          <div class="translation-identity"><span class="companion-eyebrow">跨过语言，贴近原意</span>
            <strong id="translation-title">当前页译文</strong>
            <span id="translation-state">尚未翻译</span>
          </div>
          <div class="translation-header-actions">
            <button id="close-translation" type="button" title="收起译文" aria-label="收起译文">×</button>
          </div>
        </header>
        <details class="translation-options"><summary>翻译设置</summary>
        <div class="translation-commandbar" aria-label="翻译操作与参数">
          <div id="retranslation-controls" class="retranslation-controls" aria-label="翻译参数">
            <div class="translation-settings">
              <label>
                <span>模型名称</span>
                <select id="retranslation-model" aria-label="翻译模型">
                  <option value="gpt-6.1-sol">gpt-6.1-sol</option>
                  <option value="gpt-6-astra">gpt-6-astra</option>
                </select>
              </label>
              <label>
                <span>推理强度</span>
                <select id="retranslation-effort" aria-label="翻译推理强度">
                  <option value="low">low</option>
                  <option value="medium">medium</option>
                  <option value="high">high</option>
                  <option value="xhigh">xhigh</option>
                  <option value="max">max</option>
                  <option value="ultra">ultra</option>
                </select>
              </label>
            </div>
            <span id="full-translation-progress" class="full-translation-progress" aria-live="polite" hidden></span>

          </div>
        </div>
        </details>
            <div class="translation-actions">
              <button id="translate-page" type="button" class="translation-action" title="结合页面文本和整页图像翻译当前 PDF 页">翻译本页</button>
              <button id="translate-all" type="button" class="translation-all-action" title="按当前模型和强度在后台补齐所有未缓存页面；离开当前文档后仍会继续">翻译全文</button>
              <button id="retranslate-page" type="button" title="忽略当前页缓存，按所选模型和推理强度重新翻译">重新翻译</button>
            </div>
        <div id="full-translation-status" class="full-translation-status" role="status" aria-live="polite" hidden>
          <div class="full-translation-status__row">
            <strong id="full-translation-status-title">全文翻译准备中</strong>
            <span id="full-translation-elapsed">00:00</span>
          </div>
          <progress id="full-translation-meter" max="1" value="0"></progress>
          <span id="full-translation-detail">正在检查本地缓存…</span>
        </div>
        <div id="translation-content" class="translation-content">
          <div class="translation-empty">翻译本页后，译文会缓存在本机并与该 PDF 页关联。</div>
        </div>
      </section>
    </div>
    <script src="../vendor/markdown-it.min.js"></script>
    <script src="../vendor/markdown-it-texmath.js"></script>
    <script src="math-config.js"></script>
    <script defer src="../vendor/mathjax/tex-mml-chtml.js"></script>
    <script type="module" src="viewer.mjs?v=20260928-model-settings"></script>
  </body>
</html>
