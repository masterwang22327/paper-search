stages:
  - name: "语言建模与 Transformer 地基"
    route_type: "主干"
    purpose: "先把论文公式恢复成样本、shape、前向、loss 和更新，再建立词元表示、序列条件概率、注意力信息路由和文本生成过程。"
    entry: "从这里开始不要求先会 RNN 或 Transformer；只需要能读向量，并愿意手算一个三词表例子。"
    outcome: "读完应能画出 lookup -> 状态/注意力 -> logits -> softmax -> loss 的完整路径，并说清训练与逐 token 推理为何不是同一时钟。"
    checkpoint: "给定三个 token，能否指出表示从哪里来、哪个状态跨位置传递、softmax 沿哪一轴，以及 loss 的梯度最终更新谁？"
    papers:
      - file: formula-reading-bridge.md
        bridge: "先统一阅读动作：把求和、连乘、softmax、交叉熵、mask、归约和梯度落到一个三词表数值更新，后续不必在每篇论文里重新猜符号。"
      - file: neural-lm-word2vec.md
        bridge: "已经会把公式拆成一次更新后，从词表示与语言模型目标开始，分清词向量、完整概率模型和替代训练目标各自是什么。"
      - file: pretransformer-gpt-lineage.md
        bridge: "静态向量只回答‘一个词查到什么’，还没有回答‘一串词怎样形成可供生成读取的状态’；本页先用 RNN/Seq2Seq 建立状态，再让 Bahdanau attention 按输出位置回看源句，最后接到 GPT 的逐词预训练。"
      - file: contextual-representations-finetuning.md
        bridge: "上一页已经解释 RNN/LSTM 隐藏状态为何随上下文变化；现在再看 ELMo 怎样把不同层的上下文状态交给下游任务，随后用 ULMFiT 与 DAPT/TAPT 分开 frozen feature、全参微调和继续预训练。"
      - file: arxiv-1706.03762.md
        bridge: "上一篇暴露了逐位置循环计算和附加注意力的限制；本篇把注意力升级为整个序列模型的骨架。"
      - file: modern-transformer-block.md
        bridge: "Transformer 骨架已经清楚后，继续看 residual 与 norm 的放置怎样改变梯度路径，再辨认现代生成模型 block 为训练和服务增加了哪些状态。"
      - file: decoding.md
        bridge: "模型结构最终只给出下一个词元的概率分布；本篇继续解释这组概率怎样变成实际可见的文本。"

  - name: "预训练、数据、规模与评测地基"
    route_type: "主干"
    purpose: "沿可见性、任务接口、训练分布和算力预算，理解基础模型能力究竟从哪里来。"
    entry: "进入前应已理解 causal mask、encoder/decoder 和 next-token loss；本阶段先固定 token 与数据人口，再比较目标和规模。"
    outcome: "读完应能把一次模型提升拆成 tokenizer/数据、目标函数、参数与 token 预算、任务协议和评测器，而不是只归因于模型名字或参数量。"
    checkpoint: "看到一个新模型分数时，能否先问清 checkpoint、tokenizer、训练 token、prompt/decode/parser/judge 和比较分母？"
    papers:
      - file: tokenization-data-curation.md
        bridge: "进入预训练论文前先固定模型真正看见的离散单位：字符经过 Unicode/UTF-8、切分、特殊 token、去重和 packing 后才成为训练样本；同一原文可以被不同 tokenizer 改写成不同长度和边界。"
      - file: arxiv-1810.04805.md
        bridge: "token 与数据边界明确后，用 BERT、XLNet、ELECTRA 对照三条 encoder 监督路径：selected-token MLM、permutation target-aware AR 与 all-position RTD；重点区分输入顺序、预测位置和标签来源。"
      - file: arxiv-1910.10683.md
        bridge: "encoder-only 三条路径之后，先用 BART 把双向 source encoder 接到 causal decoder，并用完整原文重建提供生成接口；再用 T5 把 target 缩成缺失 spans、把所有下游任务统一为 text-to-text。"
      - file: arxiv-2005.14165.md
        bridge: "有了目标与数据账本，再看 GPT-3 如何通过扩大 causal LM 训练获得 in-context learning 现象。"
      - file: scaling-kaplan-chinchilla.md
        bridge: "GPT-3 展示规模现象，本篇把参数、token 与算力之间的经验关系变成可计算的预算问题。"
      - file: arxiv-2204.02311.md
        bridge: "Scaling law 给出预算方向，PaLM 展示超大 dense 模型如何把数据、并行、稳定性和评测组合成系统。"
      - file: arxiv-2302.13971.md
        bridge: "PaLM 代表参数优先的大系统，LLaMA 转而从长期推理成本审视较小模型与更多训练数据的取舍。"
      - file: evaluation-effective-context.md
        bridge: "模型、数据和规模路线已经走完，但论文结论仍取决于怎样测；本页把样本、prompt、decode、parser、judge、aggregation 和有效上下文固定成可重放合同，为后续 RLHF、Agent 与系统比较提供共同尺子。"

  - name: "训练、并行、稀疏容量与高效适配"
    route_type: "主干"
    purpose: "从单参数更新走到多卡状态分片，随后把通信与所有权知识用到稀疏专家路由，再讨论稳定训练、低成本适配和教师—学生迁移。"
    entry: "进入前应能解释 loss 如何产生梯度，以及参数、activation 与 optimizer state 不是同一份内存。"
    outcome: "读完应能按参数/梯度/状态/activation/通信五本账比较 dense、MoE、并行、PEFT 和蒸馏。"
    checkpoint: "面对 OOM、吞吐下降或训练发散，能否先定位是持久状态、峰值 activation、通信、路由热点还是数值尺度？"
    papers:
      - file: adam-adamw.md
        bridge: "先把每一步参数更新和 optimizer state 算清楚，再用 Adafactor 区分 full/factored second moment、update clipping 与 relative step size，最后用 AdamW 区分 decay path；这样才能正确讨论训练显存、并行和数值稳定。"
      - file: megatron-zero.md
        bridge: "先用 GPipe 的 stage/micro-batch/rematerialization/bubble 建立流水线语义，再回到 Megatron/ZeRO：AdamW 明确了参数、梯度和状态三本账，本篇继续研究这些状态超出单卡后究竟怎样切分。"
      - file: training-numerical-stability.md
        bridge: "状态切分和跨卡归约已经明确后，先检查 dtype、归约、clip、恢复与精度路径怎样让一次分布式更新失真；稳定性是继续增加稀疏路由前的共同前置。"
      - file: moe-switch.md
        bridge: "分布式状态与数值路径都能单独核对后，再看稀疏专家如何让每个 token 只访问部分 FFN，以及容量与 all-to-all 为什么成为新瓶颈。"
      - file: moe-routing-load-balancing.md
        bridge: "Switch 建立 token-choice、capacity 与辅助损失后，先补 dense checkpoint 怎样 upcycle 为 experts、何时不如从头训练，再用 DeepSeekMoE/OLMoE 把 expert width、shared active budget、matched recipe、routing association 与功能干预拆开；最后比较 Expert Choice、loss-free bias、V3、Qwen2 与 Qwen3，避免用采用事实或领域富集替代因果证据。"
      - file: mixture-of-depths.md
        bridge: "MoE 已把 token 在同一层送往不同 FFN path；现在依次比较 MoD 的中层跳过/可重入、LayerSkip 的独立层 suffix termination/self-verification，以及 MoR 的共享层单调递归，并分账训练路由、K/V read semantics 与服务测量。"
      - file: arxiv-2106.09685.md
        bridge: "理解全量训练成本后，LoRA 只更新低秩增量，明确它省下的是哪些参数与 optimizer 状态。"
      - file: peft-adapters-prefix-prompt-qlora.md
        bridge: "LoRA 提供一个具体基线，再把 Adapter、Prefix、Prompt 和 QLoRA 放到同一资源账本中比较。"
      - file: knowledge-distillation-autoregressive.md
        bridge: "PEFT 改变可训练对象；蒸馏则改变监督来源，继续比较 logits、响应与在线反馈分别传递什么。"

  - name: "指令、偏好与推理后训练"
    route_type: "主干"
    purpose: "先区分提示、监督和推理时计算，再沿偏好数据、策略优化和直接偏好目标进入 reasoning RL。"
    entry: "进入前应理解 causal LM、交叉熵、采样和通用评测合同；PPO 会在本阶段用两动作例重新建立。"
    outcome: "读完应能为 SFT、RM、PPO、DPO、GRPO 分别指出样本来自哪里、scorer 是谁、梯度给谁、哪些模型只在训练时存在。"
    checkpoint: "给定一条 prompt/response，能否画出 generator、reference、reward/verifier、old/current policy 与 loss 的所有权和刷新时钟？"
    papers:
      - file: instruction-cot-self-consistency.md
        bridge: "基础模型训练完成后，用同一道算术题先区分三件事：监督样本怎样更新参数、带步骤提示怎样只改变当前生成、多路径投票怎样只改变最终决策；再进入现代推理后训练。"
      - file: preference-reward-overoptimization.md
        bridge: "先读 Stiennon 2020 pp.3–7，补齐 Human Preferences 到 InstructGPT 的 SFT→RM→PPO/KL 语言模型桥；再研究比较数据怎样变成 reward，以及策略为何会主动利用代理目标的误差。"
      - file: arxiv-1707.06347.md
        bridge: "比较数据怎样变成 reward、代理怎样被利用已经清楚后，现在用两动作手算 reward 如何经 log-prob 改变概率，再学 PPO 为什么还需要 advantage、old/current ratio 和 clip。"
      - file: neurips-2022-instructgpt.md
        bridge: "PPO、偏好模型和 SFT 三块已经分别清楚，现在用 InstructGPT 把它们连成完整 RLHF 流程。"
      - file: neurips-2023-dpo.md
        bridge: "标准 RLHF 流程明确后，DPO 才能作为对照：它把显式 reward 与在线 RL 改写成离线 pair loss。"
      - file: process-supervision-test-time-search.md
        bridge: "PPO 与 DPO 已经说明 generator 怎样被更新；现在先冻结 generator，把 ORM/PRM 的监督、best-of-N/search 的选择和 verifier-reward RL 拆成三种不同动作。"
      - file: reasoning-rl-reductions.md
        bridge: "PPO/DPO 的策略更新与 verifier 的训练、选择边界都已明确；现在从概率比、reference 和 reduction 出发，审计 GRPO、DAPO、GSPO 的真实优化单位。"

  - name: "Agentic RL：credit、能力边界与系统合同"
    route_type: "主干"
    purpose: "先确定长轨迹 outcome 怎样对齐到 state/step/turn/branch，再用 headroom 与 PASS@(k,T) 检查是否真有能力增量，最后验收环境、harness、token provenance 和 rollout 系统是否保持算法语义。"
    entry: "进入前应掌握 PPO/GRPO 的 advantage、importance ratio 与评测合同，并能画出基本的 observation -> action -> environment loop。"
    outcome: "读完应能判断 reward 对齐到哪个对象、success 是否可信、能力增益属于哪种 estimand，以及异步系统是否仍在优化声称的样本。"
    checkpoint: "一条 Agent 轨迹变成训练 batch 时，能否逐项固定 state、action span、verdict、old log-prob、policy version、route、reduction 和失败责任？"
    papers:
      - file: agentic-rl-credit-assignment.md
        bridge: "PPO/GRPO 的 advantage、ratio 与 reduction 单位已经清楚后，比较 repeated state、environment step、state graph、gold-likelihood turn 和 sandbox branch 五种 credit object；不把不同信息条件写成升级榜。"
      - file: evaluator-judge-validity-cua.md
        bridge: "上一篇暂时把终局 verdict 当作可信输入；本篇打开 verdict 黑箱，把 task、environment、trajectory、script oracle、VLM judge 与人工 gold 拆成测量管线，再判断 credit 是否建立在可靠标签上。"
      - file: agentic-rl-capability-failures.md
        bridge: "成功标签的误分边界已经明确后，再用 greedy/sampled headroom、PASS@(k,T)、positive control 和 control-token trace 分开可靠性、观测边界与接口崩溃。"
      - file: agentic-rl-environments-systems.md
        bridge: "先知道要更新什么、怎样证明增量，再验收 executable state、verifier、native harness、exact tokens/log-probs、policy version、MoE route 和完整基础设施成本。"
      - file: async-staleness-rolloutpipe.md
        bridge: "环境与 rollout provenance 已经建立后，进一步区分配置 lag、sampled log-ratio tail、MoE route mismatch 与 complete-group 调度；不要把吞吐重叠自动写成策略质量提升。"

  - name: "可扩展监督与控制评测"
    route_type: "选读分支"
    purpose: "先用通用评测合同固定人口、观察者和统计单位，再区分弱标签训练、人机辅助、辩论、运行时控制与条件行为审计各自能承诺什么。"
    entry: "进入前应理解 reward model、过程监督、PPO，以及评测中的 population、judge 与 aggregation。"
    outcome: "读完应能区分监督、辅助审计、辩论、控制与根因解释，不把局部 judge accuracy 写成高风险安全保证。"
    checkpoint: "面对一个 scalable oversight 结果，能否指出谁知道真值、谁能看证据、失败后是否可停止，以及 utility tax 怎样计算？"
    papers:
      - file: scalable-oversight-control-evaluation.md
        bridge: "Agentic RL 已经暴露环境与 judge 的测量风险；这条安全选读分支进一步处理强模型可能超过或误导监督者时的监督、检查、控制与根因审计。"

  - name: "Embedding 与单向量检索主干"
    route_type: "主干"
    purpose: "从 BERT hidden state 进入可离线索引的句向量，再建立训练 pair、negative、DPR 双编码器与 Recall@K。"
    entry: "进入前建议已读 BERT 与 tokenizer；只需先理解 hidden state、点积和 softmax，本阶段会重新建立 negative 与 Recall@K。"
    outcome: "读完应能把 encoder/readout、训练 pair/negative、query/passage 向量、index 和 Recall@K 分成不同对象。"
    checkpoint: "给定一批 query/passage，能否写出正例、batch 内负例、相似度矩阵、NLL 和 Recall@K 分别怎样计算？"
    papers:
      - file: sentence-embeddings-semantic-retrieval.md
        bridge: "从 BERT hidden state 出发，用 SBERT/SimCSE 分清 cross-encoder、bi-encoder、pooling、对比负样本和 STS 几何；这一步解释为什么表示需要专门训练才能离线索引。"
      - file: general-text-embedding-training.md
        bridge: "SBERT/SimCSE 已说明句向量为何需要专门监督；本页把 pooling、prefix、pair/negative、temperature、batch、多语、蒸馏和 MRL 还原成同一条可手算训练路径。"
      - file: dpr-dense-retrieval.md
        bridge: "通用对比训练路径明确后，用 DPR 固定 query/passage 两端、B×B NLL、BM25 对照和 QA Recall@K，为下一阶段 RAG 提供可测的候选召回接口。"

  - name: "外部知识与事实性"
    route_type: "主干"
    purpose: "围绕 knowledge_factory 的实际任务，从召回进入条件生成，再区分来源存在、主张被支持和模型置信度。"
    entry: "进入前应已理解 DPR/Recall@K 和阶段 2 的通用评测合同。"
    outcome: "读完应能分开 retrieval coverage、生成正确性、引用支持、校准、采样一致性和真实业务效用。"
    checkpoint: "答案带引用时，能否分别检查候选是否召回、引用是否对应原文、原文是否支持主张、答案是否有用？"
    papers:
      - file: rag-external-memory.md
        bridge: "DPR 已经把候选召回变成可测接口；RAG 继续研究如何把检索结果作为 latent memory 交给生成器。"
      - file: factuality-calibration-selfcheck.md
        bridge: "RAG 提供来源但不保证答案正确；本篇区分事实性、置信校准和多次采样一致性。"

  - name: "检索架构与领域选型"
    route_type: "选读分支"
    purpose: "回到 DPR 的单向量基线，比较多向量交互、ANN/模型谱系、LLM backbone 和代码域结构带来的质量、索引与证据取舍。"
    entry: "这是检索选读分支；应先完成单向量 embedding、DPR/Recall@K。RAG 主线不依赖读完本阶段。"
    outcome: "读完应能把 single/multi-vector index、ANN 近似、LLM readout、代码结构和下游 SLO 分成不同选型轴。"
    checkpoint: "面对一个 embedding leaderboard，能否先核对 pooling、prefix、dimension、normalization、negative、index、metric 和下游任务？"
    papers:
      - file: late-interaction-multivector-retrieval.md
        bridge: "回到 DPR 的单向量基线，用 ColBERT/ColBERTv2 引入 multi-vector/late interaction，分清 token-level score、候选召回、压缩 index 和重排成本。"
      - file: embedding-models-lineage-selection.md
        bridge: "single-vector、multi-vector、DPR 与 Recall@K 已有共同坐标；现在读 FAISS 的 ANN/IVF/PQ/bytes-recall，并用 MTEB 与模型谱系练习选型。"
      - file: llm-embedding-qwen-mistral.md
        bridge: "通用 encoder 与索引合同明确后，再比较 causal EOS、bidirectional mask、MNTP/SimCSE、few-shot ICL、dual-mode、Qwen3 与 Mistral/Codestral Embed 的公开边界。"
      - file: code-embedding-retrieval.md
        bridge: "文本 embedding 的训练、索引和指标已经分账；最后转到代码域，审计 AST/data-flow、行为/文档粒度、hard negative 和 repo/time split 怎样改变同一检索合同。"

  - name: "长上下文与序列状态"
    route_type: "进阶分支"
    purpose: "从 KV cache 的服务成本出发，区分窗口容量与有效利用，再比较压缩状态和百万级上下文两条路线。"
    entry: "进入前应理解 Transformer Q/K/V、KV cache、服务 SLO 和通用评测；状态空间公式不是起点。"
    outcome: "读完应能分开 raw context capacity、每 query 访问量、固定递归状态、有效检索能力和端到端时延。"
    checkpoint: "看到‘支持 1M context’或‘无 KV cache’时，能否追问训练长度、状态容量、访问路径、检索任务与真实 prefill/decode 成本？"
    papers:
      - file: inference-serving-quantization.md
        bridge: "评测合同建立后进入推理系统，先弄清 KV cache、调度、kernel、量化和服务 SLO 分别改变什么；KIVI 用 K/V 不同量化轴与近期高精度 residual 说明低 bit 是状态 ABI，不是一个 dtype 开关。"
      - file: long-context-memory-evaluation.md
        bridge: "掌握 KV 与服务成本后，再把长上下文拆成容量、状态、检索、利用和评测五层问题。"
      - file: arxiv-2312.00752.md
        bridge: "长上下文暴露 attention 与 KV 状态的扩展瓶颈，Mamba 提供选择性压缩状态这一替代路线。"
      - file: efficient-attention-delta-state.md
        bridge: "Mamba 先说明输入相关 gate 怎样管理固定状态；再用 DeltaNet/Gated DeltaNet 比较只追加、按 key 覆盖与全状态遗忘，并用 Differential Attention 反例阻止名称混淆。"
      - file: native-sparse-attention.md
        bridge: "固定状态压缩的收益与信息瓶颈已经清楚后，用 NSA 补中间路线：保留逐 token raw K/V，但让每个 query 只做全局粗查、少量连续块精读和近期读取；重点区分访问压缩、容量压缩与真实 SLO。"
      - file: arxiv-2403.05530.md
        bridge: "Mamba/Delta 与 NSA 已分别展示状态压缩、访问压缩及各自 hybrid 边界；Gemini 1.5 再作为闭源 attention/MoE 对照，检验百万级窗口是否真的能利用。"

  - name: "现代模型系列"
    route_type: "综合验收"
    purpose: "复用现代 block、数据、后训练、MoE 与长上下文知识，按 Llama、Qwen、DeepSeek 三个家族做版本差分；只有 DeepSeek-V3 到 V2/V3/R1 保留强顺序。"
