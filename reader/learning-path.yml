stages:
  - name: "语言建模与 Transformer 地基"
    route_type: "主干"
    purpose: "先把论文公式恢复成样本、shape、前向、loss 和更新，再建立词元表示、序列条件概率、注意力信息路由和文本生成过程。"
    entry: "从这里开始不要求先会 RNN 或 Transformer；只需要能读向量，并愿意手算一个三词表例子。"
    outcome: "读完应能画出 lookup -> 状态/注意力 -> logits -> softmax -> loss 的完整路径，并说清训练与逐 token 推理为何不是同一时钟。"
    checkpoint: "给定三个 token，能否指出表示从哪里来、哪个状态跨位置传递、softmax 沿哪一轴，以及 loss 的梯度最终更新谁？"
    papers:
      - file: formula-reading-bridge.md
        bridge: "先统一阅读动作：把求和、连乘、softmax、交叉熵、mask、归约和梯度落到一个三词表数值更新，后续不必在每篇论文里重新猜符号。"
      - file: neural-lm-word2vec.md
        bridge: "已经会把公式拆成一次更新后，从词表示与语言模型目标开始，分清词向量、完整概率模型和替代训练目标各自是什么。"
      - file: pretransformer-gpt-lineage.md
        bridge: "静态向量只回答‘一个词查到什么’，还没有回答‘一串词怎样形成可供生成读取的状态’；本页先用 RNN/Seq2Seq 建立状态，再让 Bahdanau attention 按输出位置回看源句，最后接到 GPT 的逐词预训练。"
      - file: contextual-representations-finetuning.md
        bridge: "上一页已经解释 RNN/LSTM 隐藏状态为何随上下文变化；现在再看 ELMo 怎样把不同层的上下文状态交给下游任务，随后用 ULMFiT 与 DAPT/TAPT 分开 frozen feature、全参微调和继续预训练。"
      - file: arxiv-1706.03762.md
        bridge: "上一篇暴露了逐位置循环计算和附加注意力的限制；本篇把注意力升级为整个序列模型的骨架。"
      - file: modern-transformer-block.md
        bridge: "Transformer 骨架已经清楚后，先用论文角色地图区分共同基线、机制论文、现代配方与前沿选读；再沿跨层优化、局部变换、位置表达和历史状态四条路径追踪旧问题、改动对象、不变量与新代价，最后回到 GQA、Llama 3.1、Mistral 和 DeepSeek-V2 的组合关系。"
      - file: decoding.md
        bridge: "上一篇停在 logits 与下一词元概率；本篇固定模型权重，只研究温度、过滤、搜索、采样与停止规则怎样把概率变成文本，并用模型/解码/评测三层检查点结束阶段 1。"

  - name: "预训练、数据、规模与评测地基"
    route_type: "主干"
    purpose: "沿可见性、任务接口、训练分布和算力预算，理解基础模型能力究竟从哪里来。"
    entry: "进入前应已理解 causal mask、encoder/decoder 和 next-token loss；本阶段先固定 token 与数据人口，再比较目标和规模。"
    outcome: "读完应能把一次模型提升拆成 tokenizer/数据、目标函数、参数与 token 预算、任务协议和评测器，而不是只归因于模型名字或参数量。"
    checkpoint: "看到一个新模型分数时，能否先问清 checkpoint、tokenizer、训练 token、prompt/decode/parser/judge 和比较分母？"
    papers:
      - file: tokenization-data-curation.md
        bridge: "进入预训练论文前先固定模型真正看见的离散单位：字符经过 Unicode/UTF-8、切分、特殊 token、去重和 packing 后才成为训练样本；同一原文可以被不同 tokenizer 改写成不同长度和边界。"
      - file: arxiv-1810.04805.md
        bridge: "token 与数据边界明确后，用 BERT、XLNet、ELECTRA 对照三条 encoder 监督路径：selected-token MLM、permutation target-aware AR 与 all-position RTD；重点区分输入顺序、预测位置和标签来源。"
      - file: arxiv-1910.10683.md
        bridge: "encoder-only 三条路径之后，先用 BART 把双向 source encoder 接到 causal decoder，并用完整原文重建提供生成接口；再用 T5 把 target 缩成缺失 spans、把所有下游任务统一为 text-to-text。"
      - file: arxiv-2005.14165.md
        bridge: "有了目标与数据账本，再看 GPT-3 如何通过扩大 causal LM 训练获得 in-context learning 现象。"
      - file: scaling-kaplan-chinchilla.md
        bridge: "GPT-3 展示规模现象，本篇把参数、token 与算力之间的经验关系变成可计算的预算问题。"
      - file: arxiv-2204.02311.md
        bridge: "Scaling law 给出预算方向，PaLM 展示超大 dense 模型如何把数据、并行、稳定性和评测组合成系统。"
      - file: arxiv-2302.13971.md
        bridge: "PaLM 代表参数优先的大系统，LLaMA 转而从长期推理成本审视较小模型与更多训练数据的取舍。"
      - file: evaluation-effective-context.md
        bridge: "模型、数据和规模路线已经走完，但论文结论仍取决于怎样测；本页把样本、prompt、decode、parser、judge、aggregation 和有效上下文固定成可重放合同，为后续 RLHF、Agent 与系统比较提供共同尺子。"

  - name: "训练、并行、稀疏容量与高效适配"
    route_type: "主干"
    purpose: "从单参数更新走到多卡状态分片与数值执行，再把通信、所有权和故障时钟用于稀疏专家路由，最后讨论低成本适配与教师—学生迁移。"
    entry: "进入前应能解释 loss 如何产生梯度，以及参数、activation 与 optimizer state 不是同一份内存。"
    outcome: "读完应能按参数/梯度/状态/activation/通信五本账比较 dense、MoE、并行、PEFT 和蒸馏。"
    checkpoint: "面对 OOM、吞吐下降或训练发散，能否先定位是持久状态、峰值 activation、通信、路由热点还是数值尺度？"
    papers:
      - file: adam-adamw.md
        bridge: "先把每一步参数更新和 optimizer state 算清楚，再用 Adafactor 区分 full/factored second moment、update clipping 与 relative step size，最后用 AdamW 区分 decay path；这样才能正确讨论训练显存、并行和数值稳定。"
      - file: megatron-zero.md
        bridge: "AdamW 已明确参数、梯度和优化器状态；本篇先跟同一个参数跨两个 rank 完成归约与更新，补齐 activation 和通信 buffer 的所有权，再在第二遍比较 Megatron、GPipe 与 ZeRO 分别切什么。"
      - file: training-numerical-stability.md
        bridge: "状态切分和跨卡归约已经明确后，先检查 dtype、归约、clip、恢复与精度路径怎样让一次分布式更新失真；稳定性是继续增加稀疏路由前的共同前置。"
      - file: moe-switch.md
        bridge: "分布式状态与数值路径都能单独核对后，让 8 个 token 经过一次 top-1 路由：追踪 router、expert、capacity overflow、residual 与 all-to-all，分清总容量、单 token 计算和通信三本账。"
      - file: moe-routing-load-balancing.md
        bridge: "Switch 已建立 token-choice、capacity 与辅助损失；本篇固定同一 4-token score matrix，先比较 router gradient、expert bucket 和跨步 bias controller，再把现代模型谱系与专业化证据留到第二遍。"
      - file: mixture-of-depths.md
        bridge: "MoE 已让 token 在同一层选择 FFN；本篇改为选择整块深度，用 4 个 token 区分 MoD 跳过后重入、LayerSkip 后缀终止和 MoR 共享层递归，并核对各自 K/V 与服务时钟。"
      - file: arxiv-2106.09685.md
        bridge: "理解全量训练成本后，固定一个 `2x2` 线性层：冻结 `W0`、只更新 `A/B`，再分开训练、adapter-only 保存与 merged/unmerged 服务三个时钟。"
      - file: peft-adapters-prefix-prompt-qlora.md
        bridge: "LoRA 提供了具体基线；现在保持同一基座、样本和 loss，只改变任务自由度的位置，比较 Adapter、Prefix、Prompt、LoRA 与 QLoRA 谁接收梯度、保存什么、服务时谁仍存在。"
      - file: knowledge-distillation-autoregressive.md
        bridge: "PEFT 改变可训练对象而不改变监督来源；蒸馏固定 teacher/student 与同一 prompt，继续比较教师交付完整 logits、离线 response 或学生前缀上的在线信号时，训练人口和时钟怎样变化。"

  - name: "指令、偏好与推理后训练"
    route_type: "主干"
    purpose: "先区分提示、监督和推理时计算，再沿偏好数据、策略优化和直接偏好目标进入 reasoning RL。"
    entry: "进入前应理解 causal LM、交叉熵、采样和通用评测合同；PPO 会在本阶段用两动作例重新建立。"
    outcome: "读完应能为 SFT、RM、PPO、DPO、GRPO 分别指出样本来自哪里、scorer 是谁、梯度给谁、哪些模型只在训练时存在。"
    checkpoint: "给定一条 prompt/response，能否画出 generator、reference、reward/verifier、old/current policy 与 loss 的所有权和刷新时钟？"
    papers:
      - file: instruction-cot-self-consistency.md
        bridge: "基础模型训练完成后，用同一道算术题先区分三件事：监督样本怎样更新参数、带步骤提示怎样只改变当前生成、多路径投票怎样只改变最终决策；再进入现代推理后训练。"
      - file: reward-verifier-policy-learning.md
        bridge: "沿用 `17+26`，加入一条错误抵消但答案为 43 的轨迹；切换 best-of-N、RS-SFT、PPO/GRPO、DPO、MCTS-DPO 与 ILQL，逐项固定样本生产者、标签/评分器、梯度接收者和内外刷新时钟。"
      - file: preference-reward-overoptimization.md
        bridge: "沿用同一 prompt 和 A/B 回答，先把偏好标签变成 RM 更新，再冻结 RM 让 policy 搜索新候选，最后用独立 gold 审计分布漂移；历史闭环与现代训练器第二遍再读。"
      - file: arxiv-1707.06347.md
        bridge: "比较数据怎样变成 reward、代理怎样被利用已经清楚后，用同一条两动作 rollout 依次计算 advantage、old/current ratio、clip、多 epoch 与快照刷新，并确认 clip 不是概率硬边界。"
      - file: neurips-2022-instructgpt.md
        bridge: "PPO、偏好模型和 SFT 三块已经分别清楚；现在固定同一数据库备份问题和两条回答，把 SFT、RM、PPO 的数据生产者、冻结对象、梯度与 checkpoint 时钟连起来。"
      - file: neurips-2023-dpo.md
        bridge: "标准 RLHF 流程明确后，DPO 保持同一 chosen/rejected pair，用 current/reference 四个序列分数直接形成离线 pair loss；显式 RM、critic 和在线 rollout 因而退出这条训练图。"
      - file: process-supervision-test-time-search.md
        bridge: "PPO 与 DPO 已经说明 generator 怎样更新；现在固定 `17+26` 的两条候选并冻结 generator，把 ORM/PRM 训练、best-of-N 选择和后来用 verifier reward 更新 policy 拆成三种动作。"
      - file: reasoning-rl-reductions.md
        bridge: "策略更新与 verifier 的训练、选择边界已经明确；最后用长度 `2/8`、奖励 `1/0` 的同组回答比较 group baseline、std 与两种 token 分母，再按需审计 GRPO、DAPO、GSPO 的真实单位。"

  - name: "多模态、工具调用与运行时安全"
    route_type: "主干"
    purpose: "把视觉输入、结构化工具调用和不可信观察放回同一条 Agent ABI，先理解输入与外部状态怎样连接，再处理权限与攻击边界。"
    entry: "进入前应理解 Transformer hidden/logits、SFT 与基本 observation -> action -> environment loop；不要求先背视觉编码器或安全缩写。"
    outcome: "读完应能分开 pixels/frames、bridge tokens、call tokens、schema、permission、executor state 和 utility/security verdict。"
    checkpoint: "面对一条多模态工具轨迹，能否指出视觉 token 在哪里进入 LM、哪个字符串只是候选 action、谁拥有授权真值，以及攻击文本怎样被挡在副作用之外？"
    papers:
      - file: multimodal-llm-vision-language-abi.md
        bridge: "先把数据库控制台截图固定为 `420x840`，沿 `pixels -> visual states -> bridge -> logits -> OCR/coordinate/time parser` 走通视觉输入 ABI；先分清 token 数、时间戳和答案解析，再读 Flamingo/LLaVA/Qwen 的完整配方。"
      - file: tool-use-function-calling-abi.md
        bridge: "截图读出的 `snapshot_id=s42` 只是模型上下文；本页将它变成 call tokens，经 parser/schema、permission gate、executor 和数据库终态，接上 ReAct、Toolformer 与 tau-bench 的不同训练/评测对象。"
      - file: agent-runtime-prompt-injection-security.md
        bridge: "工具返回中加入‘恢复未校验 s43’的不可信备注，沿用同一调用 ABI 区分 provenance、semantic content、authorization、side effect 与 verdict，再看层级训练和 stateful injection benchmark 的边界。"

  - name: "Agentic RL：credit、能力边界与系统合同"
    route_type: "主干"
    purpose: "先确定长轨迹 outcome 怎样对齐到 state/step/turn/branch，再用 headroom 与 PASS@(k,T) 检查是否真有能力增量，最后验收环境、harness、token provenance 和 rollout 系统是否保持算法语义。"
    entry: "进入前应掌握 PPO/GRPO 的 advantage、importance ratio 与评测合同，并能画出基本的 observation -> action -> environment loop。"
    outcome: "读完应能判断 reward 对齐到哪个对象、success 是否可信、能力增益属于哪种 estimand，以及异步系统是否仍在优化声称的样本。"
    checkpoint: "一条 Agent 轨迹变成训练 batch 时，能否逐项固定 state、action span、verdict、old log-prob、policy version、route、reduction 和失败责任？"
    papers:
      - file: agentic-rl-credit-assignment.md
        bridge: "PPO/GRPO 的 advantage、ratio 与 reduction 单位已经清楚后，固定 Daily→Weekly 三步轨迹，先走 state→action→transition→verdict→credit→action-token loss；五种 credit 方法放到第二遍。"
      - file: evaluator-judge-validity-cua.md
        bridge: "上一篇暂以审计后的 reward 1 构造 credit；本篇回到同一成功轨迹，解释 raw script 0、VLM 1、human 1 为何会反转训练方向，再把 execution、harness 和 judge error 分账。"
      - file: agentic-rl-capability-failures.md
        bridge: "成功标签的误分边界已经明确后，固定 Atlas 三跳检索 checkpoint C0，用 greedy 失败与 8 条 sampled rollout 手算 PASS@(k,T)，分开 capability、reliability、format 和 harness。"
      - file: agentic-rl-environments-systems.md
        bridge: "先知道要更新什么、怎样证明增量，再把 Daily→Weekly 轨迹变成 13-token 可重放 batch，固定 state、raw verdict、action span、old log-prob、policy version 和系统所有者。"
      - file: async-staleness-rolloutpipe.md
        bridge: "上一页由 v17 生成的同一 batch 排队到 current v19；用 Ctrl+S token 手算 sampled ratio，再分开 policy lag、MoE route mismatch、tail clip 与 complete-group 调度。"

  - name: "可扩展监督与控制评测"
    route_type: "选读分支"
    purpose: "先用通用评测合同固定人口、观察者和统计单位，再区分弱标签训练、人机辅助、辩论、运行时控制与条件行为审计各自能承诺什么。"
    entry: "进入前应理解 reward model、过程监督、PPO，以及评测中的 population、judge 与 aggregation。"
    outcome: "读完应能区分监督、辅助审计、辩论、控制与根因解释，不把局部 judge accuracy 写成高风险安全保证。"
    checkpoint: "面对一个 scalable oversight 结果，能否指出谁知道真值、谁能看证据、失败后是否可停止，以及 utility tax 怎样计算？"
    papers:
      - file: scalable-oversight-control-evaluation.md
        bridge: "Agentic RL 已经暴露环境与 judge 的测量风险；现在固定一段含精确日期后门的 patch，逐一比较弱标签训练、批评、辩论、运行时控制和条件审计能看什么、更新谁、承诺什么。"

  - name: "模型内部审计、知识更新与数据飞轮"
    route_type: "进阶分支"
    purpose: "把模型内部机制、参数知识更新/删除和训练数据人口连成生命周期审计链，区分观察、因果干预、编辑、遗忘与递归数据偏移。"
    entry: "进入前应理解 hidden state、梯度、微调和评测合同；完整线性代数与隐私攻击细节放在第二遍。"
    outcome: "读完应能回答一个行为变化究竟来自哪里、改了哪个对象、是否逼近反事实 reference，以及合成数据如何改变下一代训练分布。"
    checkpoint: "看到‘模型记住了新事实/忘掉了旧数据/合成数据提升了分数’时，能否分别固定 intervention、reference、forget/retain、provenance、长尾与独立评测？"
    papers:
      - file: mechanistic-interpretability-causal-intervention.md
        bridge: "从工具安全页的 `s42/s43` 行为差异出发，先用 clean/corrupt activation patching 测量 `logit(Paris)-logit(Rome)`，再区分 probe、causal trace、ROME 和 SAE 的对象与因果边界。"
      - file: knowledge-editing-machine-unlearning.md
        bridge: "定位不等于更新：把‘保留 30 天’改为‘7 天’，再把客户记录从训练中删除，分别走 ROME/MEMIT 的局部写入与 TOFU/MUSE 的 forget/retain/privacy/reference 合同。"
      - file: synthetic-data-feedback-loops.md
        bridge: "编辑/遗忘暴露了训练人口问题；沿用数据库恢复样本，跟踪 seed、producer、filter、real/synthetic mixture、student loss 和下一代 tail coverage，连接 Self-Instruct、phi-1 与 model collapse。"

  - name: "Embedding 与单向量检索主干"
    route_type: "主干"
    purpose: "从 BERT hidden state 进入可离线索引的句向量，再建立训练 pair、negative、DPR 双编码器与 Recall@K。"
    entry: "进入前建议已读 BERT 与 tokenizer；只需先理解 hidden state、点积和 softmax，本阶段会重新建立 negative 与 Recall@K。"
    outcome: "读完应能把 encoder/readout、训练 pair/negative、query/passage 向量、index 和 Recall@K 分成不同对象。"
    checkpoint: "给定一批 query/passage，能否写出正例、batch 内负例、相似度矩阵、NLL 和 Recall@K 分别怎样计算？"
    papers:
      - file: sentence-embeddings-semantic-retrieval.md
        bridge: "从 BERT hidden state 出发，固定“如何重置密码”与三个候选，先比较 cross/bi encoder，再走 token hidden→pooling→可缓存向量→online scores。"
      - file: general-text-embedding-training.md
        bridge: "句向量接口已经明确后，加入修改邮箱、服务价格组成三组 pair，用同一个 `3×3` matrix 解释 prefix、temperature、batch negative、数据 producer 与 index 时钟。"
      - file: dpr-dense-retrieval.md
        bridge: "通用对比训练路径明确后，把同一组三条 pair 解释为 question/supporting-passage，复算 row-wise NLL，再发布 passage index 并分开 Recall@K、reader EM 与引用支持。"

  - name: "外部知识与事实性"
    route_type: "主干"
    purpose: "围绕 knowledge_factory 的实际任务，从召回进入条件生成，再区分来源存在、主张被支持和模型置信度。"
    entry: "进入前应已理解 DPR/Recall@K 和阶段 2 的通用评测合同。"
    outcome: "读完应能分开 retrieval coverage、生成正确性、引用支持、校准、采样一致性和真实业务效用。"
    checkpoint: "答案带引用时，能否分别检查候选是否召回、引用是否对应原文、原文是否支持主张、答案是否有用？"
    papers:
      - file: rag-external-memory.md
        bridge: "DPR 已召回重置密码的 `z1/z2`；本篇让两篇文档分别生成，手算 Sequence/Token marginal、责任与 query gradient，再把 citation 验收留成独立接口。"
      - file: factuality-calibration-selfcheck.md
