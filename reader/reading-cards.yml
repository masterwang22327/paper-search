papers:
  formula-reading-bridge.md:
    level: "阅读前置 · 必读工具"
    effort: "建议投入：45–75 分钟，并亲手重算一次"
    background: "真实 FAQ 显示，主要障碍不是抽象概念本身，而是论文把样本、张量、概率、归约和参数更新压进一行公式；同一困难会在 Transformer、BERT、DPO 和 GRPO 中反复出现。"
    problem: "建立一套可复用的论文公式阅读顺序：中文动作、最小样本、shape、完整前向、loss、梯度接收者、数值更新、一般公式和证据边界。"
    legacy: "最小算例只能解释计算方向，不能代替论文实验、真实大模型 shape、分布式归约、混合精度或具体框架实现。"
    team: "这是本任务根据 Reader FAQ 归纳的教学桥，不对应单一论文团队；例子回查 Bengio 2003、Transformer、Adam/AdamW 与 reasoning-RL 原始来源。"
    impact: "它不新增研究结论，但显著降低后续所有精读的符号理解成本，并把常见误解统一成可检查的九行模板。"
    value: "先读这一页，后面遇到求和、连乘、softmax、交叉熵、mask、mean、KL 或策略目标时，你能先恢复谁对谁做什么，再判断论文真正改了哪里。"
    strategy: "完整手算三词表 CE 与一步更新；然后用末尾九行模板任选一篇后续论文复述。公式来源和教学数字要始终分开。"
    prerequisites: "基础四则运算、向量和导数的直觉；不要求先会 Transformer"

  neural-lm-word2vec.md:
    level: "基础补课 · 选读"
    effort: "建议投入：45–75 分钟，抓目标函数演化"
    background: "早期模型既想算出‘下一个词的完整概率’，又想从海量文本中高效学习词的表示；当词表很大时，为每个词都计算一次概率非常昂贵。"
    problem: "解释词为什么能被表示成可计算的向量，并分清三件事：完整的语言概率模型、只抽少量反例训练的负采样，以及为了学好向量而采用的替代训练目标。"
    legacy: "静态词向量无法处理上下文多义性；负采样得到的好表示不等于可比较的句子概率，也没有解决长距离组合建模。"
    team: "主线跨越 Bengio 等人的蒙特利尔神经语言模型工作，以及 Mikolov 等人在 Google 推动的 word2vec 系列。"
    impact: "它奠定了‘把离散词转换成可训练向量’的基本思路。word2vec 成为大规模词义表示的经典入口，但一个词只有一个固定向量的假设，后来被上下文相关表示取代。"
    value: "帮你避免把词向量、语言模型输出的概率和负采样训练目标混为一谈；以后阅读词元嵌入、对比学习或采样损失会更稳。"
    strategy: "精读目标函数和‘哪些参数收到梯度’；历史实验与词相似度榜单可浏览。读完应能用中文说明：完整词表归一化与负采样到底差在哪里。"
    prerequisites: "点积、梯度、交叉熵，以及 softmax（把一组分数转换为总和等于 1 的概率）"

  contextual-representations-finetuning.md:
    level: "阶段 1 转折 · 精读"
    effort: "建议投入：100–150 分钟，并选读三篇正式原文"
    background: "静态词向量把一种词映射到一个固定向量；早期下游模型虽能再计算上下文状态，却常需从有限任务标签重新学习。直接全参微调预训练语言模型又容易在小数据上过拟合或遗忘。"
    problem: "用 ELMo、ULMFiT 与 DAPT/TAPT 分清上下文化、主干梯度、领域适配与任务适配；逐阶段说明数据、label、checkpoint 和 loss。"
    legacy: "ELMo 的监督阶段仍冻结双向 LSTM，ULMFiT 只覆盖 LSTM 分类；DAPT/TAPT 只覆盖 RoBERTa-base 英语分类，且错域与同域跨任务继续预训练均出现负迁移。"
    team: "Peters 等人的 AllenAI/UW 团队发表于 NAACL 2018；Howard/Ruder 发表于 ACL 2018；Gururangan 等人的 AllenAI/UW 团队发表于 ACL 2020。"
    impact: "三篇工作把静态 embedding、上下文 feature、受控全模型迁移与 Transformer continued pretraining 接成一条可验证路线，并固定 DAPT/TAPT 这组工程语言。"
    value: "读完能把 contextualization、bidirectionality、domain/task adaptation、frozen features、full fine-tuning 和 PEFT 分开，也不会把‘同领域’当作 checkpoint 可迁移证明。"
    strategy: "先用两个 bank 走完表示/梯度路径，再画 general->DAPT->TAPT->supervised 四阶段图；亲读 ELMo pp.1–4/6–9、ULMFiT pp.1–5/7–9、DAPT/TAPT pp.2–9/16，重点找三类负结果。"
    prerequisites: "完成前一页的三词 Seq2Seq/LSTM 状态路径即可；不要求脱离样本背 RNN/LSTM 公式，本页只复用‘同一 token occurrence 会得到上下文状态’和‘梯度是否进入预训练主干’"

  pretransformer-gpt-lineage.md:
    level: "主线必读 · 精读"
    effort: "建议投入：90–120 分钟，先于 Transformer 阅读"
    background: "早期翻译模型先把整句话压进一个固定向量；后来模型可以在生成每个词时重新查看原句；再后来，GPT 把大规模预训练与‘通过输入文字说明任务’连接起来。"
    problem: "梳理序列到序列模型（Seq2Seq）、Bahdanau 注意力、Transformer 与 GPT 之间的因果链：旧方法具体卡在哪里，后一代究竟改了哪条信息通路。"
    legacy: "这条谱系没有自动解决数据质量、长上下文、事实性、对齐与推理成本；预训练能力也不等于可控任务行为。"
    team: "综合 Sutskever/Vinyals/Le、Bahdanau/Cho/Bengio 与 OpenAI GPT 团队等多条研究线，不对应单一论文团队。"
    impact: "它把若干高影响工作的关系组织成问题演化图，比按年份背模型名更能解释今天‘只使用解码器的大语言模型’从何而来。"
    value: "这是整套 reader 的历史坐标系；读完后你应能判断一项新工作是在改信息路由、训练目标、任务接口还是规模。"
    strategy: "先完成页面开头的三词 Seq2Seq 与 Bahdanau 数值路径，再画固定向量、源位置记忆和目标前缀三条线；后半页按‘任务信息放在哪里’读 GPT。细碎榜单数字不必记。"
    prerequisites: "条件概率与向量；页面会从三词示例解释循环状态、编码器—解码器和教师强制，不要求预先熟悉 RNN 公式"

  arxiv-1706.03762.md:
    level: "核心地基 · 深度精读"
    effort: "建议投入：2–3 小时，并手算一次 attention"
    background: "2017 年的机器翻译主要依赖循环神经网络（RNN）或卷积神经网络（CNN）。循环网络必须按词元位置依次计算，远距离信息要经过很长的传递路径；注意力当时通常只是附加模块。"
    problem: "用完全基于注意力的架构替代按位置递归计算，使训练可以同时处理多个位置，并让任意两个位置通过更短的路径交换信息。"
    legacy: "全注意力仍有二次序列成本，自回归解码仍逐 token 串行；位置归纳偏置、长长度外推、训练—解码目标差距也没有消失。"
    team: "Vaswani 等人的 Google Brain / Google Research 团队工作，发表于 NeurIPS 2017。"
    impact: "它是现代大语言模型的核心架构起点之一。查询（Q）、键（K）、值（V）、多头注意力与残差堆叠等设计，已经成为行业基础设施。"
    value: "如果只能彻底拆一篇架构论文，就选它；它训练你从张量形状、信息遮罩、信息路径和计算成本理解模型，而不是只记接口名称。"
    strategy: "先固定 attention score 的一行是当前 query 位置、一列是可读取的 key 位置，手画 `[B,heads,Lq,Lk]` 与 mask；再读缩放、多头、残差和位置编码。交叉熵先只读成‘正确 token 的负对数概率’，实验参数只看结论边界。"
    prerequisites: "先完成公式桥与前 Transformer 页的三词生成路径；只需矩阵乘法和 softmax 直觉，交叉熵、教师强制、causal mask 与 Q/K/V 会在具体样本中重新建立"

  modern-transformer-block.md:
    level: "现代架构 · 深度精读"
    effort: "建议投入：2–3 小时，先画 pre/post-norm 两条残差路径"
    background: "原始 Transformer 之后，工业大语言模型逐步采用‘先归一化’、均方根归一化、门控前馈网络、旋转位置编码和共享键值头等设计。单看 2017 年原文，已经不足以读懂今天的实现。"
    problem: "把现代 Transformer 计算块拆成 norm function、pre/post placement、位置信息、注意力、历史键值表示、逐位置非线性网络和残差路径，解释每个组件究竟改了哪个张量或梯度路径。"
    legacy: "Pre-LN 的稳定性证据依赖初始化与训练配方，不代表现代模型可删除 warm-up；其他组件收益也高度依赖规模、硬件和组合归因。"
    team: "跨越 Google、Microsoft Research Asia/北大/中科院、Meta、DeepSeek 等多条研究线，并非单一团队成果；pre/post-norm关键分析正式发表于 ICML 2020。"
    impact: "它覆盖主流开源与商用大语言模型实际使用的结构，是从论文框图走向代码、显存占用和在线推理服务的关键桥梁。"
    value: "阅读模型配置或实现时，你能判断一个参数改变的是表达能力、训练稳定性、历史缓存还是计算量，而不只会复述组件名。"
    strategy: "先回查 LayerNorm 2016 pp.1–3，画 BatchNorm 的 batch 轴与 LayerNorm 的 sample/layer 轴；再读 ResNet pp.1–8 说明 identity shortcut 与 degradation 的历史来源，用‘北京 是 中国 -> 首都’走通对象层，画 `LN(x+F(x))` 与 `x+F(LN(x))` 的前向/反向；亲读 ICML 2020 pp.2–8并核对 BERT 40% 矛盾，随后按 RMSNorm/SwiGLU/RoPE/GQA/MLA职责选读。读 Gated Attention 时把 sigmoid 画在完整 SDPA 之后、`W_O` 之前；读HC/mHC时画`[d] -> [n,d]` persistent residual ABI，再把FLOPs、activation HBM、memory I/O和pipeline bytes分账。"
    prerequisites: "先读公式桥和 Transformer；正文会重新解释隐藏状态、查询/键/值、层归一化与键值缓存，不要求仅凭缩写回忆"

  moe-switch.md:
    level: "架构分支 · 定向精读"
    effort: "建议投入：75–120 分钟，重点读路由账本"
    background: "稠密模型每个 token 激活全部参数，扩大容量会同步增加计算；条件计算试图让参数容量与单 token FLOPs 部分解耦。"
    problem: "通过稀疏专家与路由器让每个 token 只访问少数 FFN expert，并处理负载均衡、容量和分布式通信问题。"
    legacy: "总参数仍要存储，all-to-all、热点专家、丢 token、训练不稳定和服务低 batch 利用率不会因 active parameter 少而消失。"
    team: "主线来自 Google Brain / Google Research 的 Sparsely-Gated MoE 与 Switch Transformer 等工作。"
    impact: "稀疏 MoE 已成为扩展模型容量的重要路线，并影响 Mixtral、DeepSeek 等现代模型，但收益强依赖系统实现。"
    value: "让你会分别核算 total/active parameters、FLOPs、通信和内存，避免把‘只激活少量专家’直接翻译成固定速度倍率。"
    strategy: "精读 router、top-k、auxiliary loss、capacity 与通信；历史任务分数可浏览。做 serving 时再深挖并行布局。"
    prerequisites: "Transformer FFN、softmax、分布式通信与负载均衡基础"

  moe-routing-load-balancing.md:
    level: "现代架构 · 推荐精读"
    effort: "建议投入：90–150 分钟，手算 auxiliary gradient 与 bias controller"
    background: "Switch 已说明稀疏专家会出现热点、capacity overflow 和通信成本，但现代模型又使用 Expert Choice、无辅助损失均衡、dense checkpoint upcycling、共享/细粒度专家与部署冗余；把它们都叫负载均衡会混淆训练起点、梯度、离散控制和系统放置。"
    problem: "把 dense-to-expert 初始化、router score、Top-k membership、combine weight、capacity/drop、均衡信号与 expert placement 拆成独立合同，比较 upcycling、辅助损失、Expert Choice 和跨 step bias controller。"
    legacy: "没有 balance-loss gradient 不等于没有负载控制；复制 dense FFN 不等于 experts 已专业化或无需继续训练；细粒度组合数不证明组合被均匀利用，训练后 shared-path dependence 也不证明其中必然是公共知识；expert count 均匀不保证 device、通信或 tail step 均匀。"
    team: "综合 Google Research 的 Sparse Upcycling/Expert Choice、DeepSeek 的 DeepSeekMoE/loss-free/V3，以及 Ai2/UW 的开放 OLMoE 与 Qwen2/Qwen3 技术报告。"
    impact: "现代稀疏 LLM 的关键差异已从是否有 MoE 转向 checkpoint 起点、expert construction、router、controller、capacity 与并行拓扑怎样组合。"
    value: "做训练或服务评审时，你能判断 dense->MoE 是否真省生命周期算力，定位均衡信号到底进梯度、hard membership 还是 deployment controller，并避免把 upcycling、no-drop 或低 active parameters 当成即时转换/固定吞吐承诺。"
    strategy: "先画五段路由链，再手算两 expert 的 `f_i P_i` 梯度与四 expert 的 bias 更新；亲读 Sparse Upcycling pp.3–7/20–23、DeepSeekMoE pp.5–18、OLMoE pp.9–24、Expert Choice p.9、Loss-Free pp.3–9，再区分 matched ablation、routing association 与跨配方采用。"
    prerequisites: "先读 Sparse MoE 与 Switch，并理解 Top-k、capacity、all-to-all 和 expert parallel"

  mixture-of-depths.md:
    level: "现代架构 · 推荐精读"
    effort: "建议投入：100–150 分钟，手算四 token MoD 路由和三递归 active sets"
    background: "标准 Transformer 每层更新所有 token；MoE 主要在 FFN experts 间选择。动态深度还可能跳过一个中间完整 block、终止独立层 suffix，或对同一组共享层选择递归次数。"
    problem: "用 MoD、LayerSkip、MoR 区分 re-entry、suffix termination、parameter sharing、causal route 与 layer/recursion-local K/V semantics。"
    legacy: "固定训练容量不保证生成负载；共享参数不等于少执行；解析 FLOPs/缓存比例不等于整模延迟；self-speculation 的 greedy verify 与 pure exit、MoR recursion 都不是同一正确性合同。"
    team: "Google DeepMind 的 David Raposo、Sam Ritter、Blake Richards、Timothy Lillicrap、Peter Conway Humphreys 与 Adam Santoro。"
    impact: "它先把条件计算从 FFN expert 扩到完整 block，再用正式 early-exit 与 recursive-sharing 反例把三类深度路径的状态和服务接口拆开。"
    value: "架构评审时能分别检查更新/read visibility、参数所有权、单调退出、KV read/cache、route causality 与 verification/commit，不再用 dynamic depth 一个标签代替。"
    strategy: "先画 MoD 的 A/B/C/D selected Q/K/V，再画 MoR 三递归的 `3/3,2/3,1/3` active sets；亲读 MoD pp.5–11、LayerSkip pp.4–7、MoR pp.3–8/28，并把每个速度/缓存数字绑定各自 timer 和排除项。"
    prerequisites: "Transformer attention/KV、residual、Top-k，以及 Sparse MoE/Switch 的 capacity 概念"

  arxiv-2312.00752.md:
    level: "架构前沿 · 研究选读"
    effort: "建议投入：90–150 分钟；非架构方向可先浏览"
    background: "Transformer 的 attention 在长序列上计算和缓存成本高；状态空间模型具有线性扫描优势，却长期难以做到内容依赖的信息选择。"
    problem: "用输入依赖的 selective state-space 参数，让模型选择性写入和读取压缩状态，同时保持可并行训练与线性时间推理。"
    legacy: "固定状态可能形成信息瓶颈，硬件 kernel 与实现细节影响很大；语言建模质量、长程检索和规模化生态仍需持续比较。"
    team: "Albert Gu 与 Tri Dao 的工作，连接 Carnegie Mellon 与 Princeton 的状态空间建模和高性能算法研究。"
    impact: "重新激活了 attention 替代架构研究，Mamba 成为 selective SSM 的代表；影响力高，但尚未取代主流 Transformer。"
    value: "帮助你区分‘无 KV cache’与‘无状态’，并理解架构效率必须同时看状态容量、scan 算法、kernel 和任务质量。"
    strategy: "先读选择机制与 train/decode 两条路径；只有做架构研究时才完整推导 SSM 离散化和并行 scan。"
    prerequisites: "线性递推、卷积/状态空间直觉、Transformer 与 GPU kernel 基础"

  efficient-attention-delta-state.md:
    level: "架构前沿 · 推荐精读"
    effort: "建议投入：90–150 分钟，手算一次二维状态覆盖"
    background: "MHA 保留完整 token K/V，普通线性 attention 把历史压进固定矩阵却只会追加；同一 key 的旧值无法定向擦除，有限状态会碰撞。"
    problem: "解释 DeltaNet 怎样用当前 key 上的预测误差覆盖关联，Gated DeltaNet 怎样再控制全状态寿命，并与 Mamba 的离散步长和 Differential Attention 的两图相减消歧。"
    legacy: "固定状态仍不可任意回看 token；纯 recurrent 模型在真实检索与更大模型对照中有负结果，训练速度又受 state/SRAM、chunk 和 kernel 约束。"
    team: "综合 DeltaNet、NVIDIA Gated DeltaNet、Recurrent Fast Weight Programmers 与 Differential Transformer 等多团队论文；Gated DeltaNet / Differential Transformer 为 ICLR 2025。"
    impact: "把高效注意力从模型名竞争改写成可审计的历史状态、写入、遗忘、训练调度和 decode ABI 问题。"
    value: "能帮助你判断流式固定状态、精确长文检索和 hybrid attention 各自适合什么负载，也避免把几个 Delta 名称误归为一类。"
    strategy: "先做二维覆盖例并写出 `v-Sk`，再比较 scalar `alpha`、KDA 的 `Diag(alpha)` 与 `beta`；亲读 DeltaNet pp.3–10、Gated Delta pp.3–10、Kimi Linear pp.3–16，Differential pp.2–3只作术语反例。"
    prerequisites: "Transformer Q/K/V、Mamba 固定状态、矩阵外积与一步梯度下降直觉"

  native-sparse-attention.md:
    level: "架构前沿 · 推荐精读"
    effort: "建议投入：75–110 分钟；选读 ACL 正式原文 pp.2–9"
    background: "完整 attention 让每个 query 读取全部历史 K/V；固定 recurrent state 虽把 decode 状态变成常数，却失去逐 token 回查。两者之间还缺一种保留原始历史、只压缩当前访问的选择。"
    problem: "解释 NSA 怎样用全历史压缩摘要做粗查、按 GQA group 共享的 Top-n 连续块做精读，再保留近期窗口；并与 DSA 的 dense-attention KL warm-up、逐 token MLA selection 比较，区分 raw KV 容量、每-query 访问量与端到端速度。"
    legacy: "固定 stride 下摘要数仍随长度增长，raw token K/V 也未被证明可淘汰；Top-n membership 离散，论文没有完整三分支消融、多 seed、checkpoint、训练栈或生产 serving ABI。DSA 虽给 dense conversion 路线，却需要 2.1B warm-up 与 943.7B sparse adaptation，indexer 仍为二次项。"
    team: "Jingyang Yuan 等人的 ACL 2025 Best Paper；本任务使用正式 proceedings 物理页，并保留正式版本内 260B/270B token 的文字不一致。"
    impact: "NSA 把 sparse attention 从部署时临时剪连接推进到从预训练开始共同学习的硬件对齐三分支路径，为长上下文提供访问压缩而非状态压缩的代表方案。"
    value: "读完能判断一个 sparse-attention claim 到底减少 FLOPs、KV bytes、读取 bytes 还是端到端 SLO，也不会把 `11.6x expected` 写成实测 TPOT，或把 dense-to-sparse 写成零训练成本。"
    strategy: "先做 NSA 32K 的 `2048 summaries + 1024 selected tokens + 512 window` 账本并画三次 softmax/gate；再对照 DSA 的 dense KL teacher、2.1B/943.7B 两阶段和 `O(Lk)+O(L^2 indexer)`，最后核对未披露 cache/serving 字段。"
    prerequisites: "Transformer Q/K/V、GQA、KV cache，并先读 Mamba/Delta 页理解固定状态压缩"

  arxiv-1810.04805.md:
    level: "预训练经典 · 精读"
    effort: "建议投入：120–180 分钟，手画三条监督路径与两个接口断点"
    background: "早期预训练表示常是单向语言模型或浅层特征拼接，下游任务难以同时利用左右上下文的深层条件表示。"
    problem: "用 BERT、XLNet 和 ELECTRA 比较 selected-token corruption、permutation target-aware AR 与 generator-conditioned all-position RTD，分清条件集合、目标位置、label 信息量和下游接口。"
    legacy: "BERT 有 mask mismatch 与稀疏词表监督；XLNet 需要只用于预训练的 two-stream 接口且收益混入 Transformer-XL/recipe；ELECTRA 的负例受 generator 条件化，dense 的只是 binary provenance label。"
    team: "BERT 来自 Google AI Language（NAACL 2019）；XLNet 来自 CMU/Google Brain（NeurIPS 2019）；ELECTRA 来自 Google Research/Stanford（ICLR 2020）。"
    impact: "BERT 推动预训练—微调范式；XLNet 把输入顺序与概率分解顺序分开并暴露 target ambiguity；ELECTRA 则把 encoder 监督效率独立成全位置替换检测问题。"
    value: "让你真正理解可见性、目标位置、partial prediction、离散 corruption、梯度断边和 encoder 表示学习，也能避免把下游迁移分数误写成 token generation 能力。"
    strategy: "先只走页面开头同一四词元在 BERT/XLNet/ELECTRA 中的输入、直接标签、输出 shape 与参数写回，再读 BERT pp.4–5、XLNet pp.2–9 和 ELECTRA pp.3–9；最后用 Table 5/App.G 检查监督密度和生成反例。"
    prerequisites: "先知道 Transformer encoder 会为每个输入位置输出 hidden 即可；selected-token CE、permutation target 和 replaced-token BCE 都由四词元样本重建，不要求先会三个缩写"

  sentence-embeddings-semantic-retrieval.md:
    level: "语义检索桥 · 推荐精读"
    effort: "建议投入：75–120 分钟，并手算一次对比损失"
    background: "BERT 能联合读取句子对，却不能高效地把一个查询与海量候选逐一重算；直接对原始 `[CLS]` 做 cosine 也没有被预训练目标塑造成可靠的通用句相似空间。"
    problem: "用 SBERT 与 SimCSE 分清 cross-encoder、bi-encoder、pooling、对比目标、负样本和评测指标，解释句子怎样变成可缓存、可索引的向量。"
    legacy: "独立编码会损失 pair-specific token interaction；in-batch negatives 可能含假负例；STS、linear probe 与真实 corpus retrieval 不能互换，SimCSE 也没有在所有 transfer 指标上支配 SBERT。"
    team: "SBERT 来自 Reimers/Gurevych 的 TU Darmstadt 团队并发表于 EMNLP-IJCNLP 2019；SimCSE 来自 Gao/Yao/Chen 的 Princeton 团队并发表于 EMNLP 2021。"
    impact: "两篇工作是现代 sentence-transformers、semantic search 与 dense retrieval 表示学习的重要入口，分别确立了双塔句向量接口和极简 dropout 对比学习配方。"
    value: "对 knowledge_factory 直接有用：能判断什么时候用向量召回、什么时候要 cross-encoder rerank，以及为什么 embedding benchmark 不能替代真实索引 Recall@K。"
    strategy: "先画 cross/bi 两张计算图并重算温度对比 loss；再读 SBERT pp.1–8 与 SimCSE pp.1–8、13、15–16，重点找跨主题退化、dropout 负结果、评测口径和 transfer 反例。"
    prerequisites: "BERT hidden、pooling、cosine/softmax、基础检索；DPR 不是前置，本页会为它建立双编码器与 negative 直觉"

  embedding-models-lineage-selection.md:
    level: "Embedding 谱系 · 推荐精读"
    effort: "建议投入：75–120 分钟，先画表示—索引—指标三层账本"
    background: "LLM backbone 能产生上下文 hidden，但可检索 embedding 还需要稳定的 readout、相似度几何、负样本分布和可重放索引；MTEB 任务/语言多样，不能由单一榜单替代生产合同。"
    problem: "沿 SBERT、DPR、E5、GTE、C-Pack/BGE、BGE-M3、M3E、Qwen3 Embedding 与 Codestral Embed 建立可验证谱系，并区分论文、模型卡/仓库和产品文档证据。"
    legacy: "MTEB/STS/CodeSearchNet 不等于真实 Recall@K、下游 reader 或 P99；M3E 当前没有定位到方法论文，Codestral Embed 当前只有官方 API/cookbook 证据。"
    team: "覆盖 Sentence-Transformers、Google、Alibaba/Qwen、BAAI、Mistral 等公开论文/产品线；机构归属不替代证据等级。"
    impact: "把 embedding 从“最后一层平均”改写为 readout、similarity、data/negative、index、metric 的组合接口，为后续文本/LLM/code 专题提供共同坐标。"
    value: "读完能回答一个模型究竟适合 single-vector、dense+sparse、multi-vector 还是 reranker，以及为什么没有一个 MTEB 分数能替你选择索引和 SLO。"
    strategy: "先读 FAISS pp.3–10 的表示→ANN→系统三层账，再读报告中的四层动作卡；亲读 MTEB pp.1–8、E5 pp.2–7、BGE-M3 pp.2–8、Qwen3 Embedding pp.2–9。M3E/Codestral 只核固定 card/docs，不把未知训练配方补成论文事实。"
    prerequisites: "SBERT/SimCSE、DPR、cosine/ANN、Recall@K；不要求先会具体向量数据库"

  general-text-embedding-training.md:
    level: "Embedding 训练 · 推荐精读"
    effort: "建议投入：90–150 分钟，并手算一次 in-batch contrastive loss"
    background: "句向量质量取决于哪些文本被拉近、哪些被推远，以及 batch、温度、前缀、pooling 和假负例怎样共同塑造几何空间。"
    problem: "解释监督句对、弱监督大规模 pair、任务混合、多语数据与 Matryoshka/维度截断如何训练一个可索引的通用表示。"
    legacy: "数据去重、hard-negative 与 benchmark leakage 会改变结论；平均池化、CLS、EOS、normalize、MRL 和维度并非可互换部署细节。"
    team: "以 E5、GTE、C-Pack/BGE、Matryoshka、MTEB 等论文为主，覆盖 Google、BAAI、中文社区和学术评测工作。"
    impact: "将“训练更多 pair”拆成数据有效性、采样分布、目标函数和服务维度四个可审计变量，避免把规模或温度口号当通用定律。"
    value: "对训练或微调 embedding 直接有用：能定位假负例、query/passsage prefix、pooling、batch 与 temperature 的具体影响，并设计 matched ablation。"
    strategy: "先用一个 B×B score matrix 走完对比 loss，再选读 E5/GTE/C-Pack/BGE-M3 的数据过滤、batch、蒸馏与长文章节；最后用 Matryoshka 复核维度—质量—索引 trade-off。"
    prerequisites: "SBERT/SimCSE、softmax/交叉熵、batch negative、向量归一化"

  llm-embedding-qwen-mistral.md:
    level: "LLM Embedding · 推荐精读"
    effort: "建议投入：90–150 分钟，重点比较 mask/readout/dual-mode"
    background: "decoder-only LLM 的 hidden 原本服务于 next-token likelihood；把它改作 embedding 需要决定 causal/bidirectional 可见性、EOS/mean pooling、instruction、LoRA/对比适配和生成模式是否共存。"
    problem: "比较 E5-Mistral、LLM2Vec、GritLM、BGE-en-ICL、Qwen3 Embedding 与 Mistral Codestral Embed 的训练/产品合同，避免把 mask flip、参数量或发布日期当成因果结论。"
    legacy: "直接取消 causal mask 可能掉点；query-only instruction 不能无条件施加到 passage；MTEB 版本、上下文长度、模型 revision 和 prompt 会影响横比；Codestral Embed 没有公开方法论文。"
    team: "Mistral/Intfloat、McGill/Meta/学界 LLM2Vec、GritLM、BAAI/Qwen 与 Mistral 产品团队；发表状态和工件状态逐项保留。"
    impact: "把 LLM 与 embedding 的相通处限定为 backbone/表示能力，把不同处落到 readout、训练对、mode、索引和 API；这是评审 decoder embedding 的最短路径。"
    value: "读完能设计一个 matched ablation：只切 mask、pooling、MNTP/SimCSE、instruction、dimension 或 dual-mode，而不是同时改变所有配方。"
    strategy: "先读 E5-Mistral pp.2–8、LLM2Vec pp.2–11、GritLM pp.2–13、BGE-en-ICL pp.2–9，再读 Qwen3 Embedding pp.2–10；Codestral 只核官方文档/cookbook 的接口与实验边界。"
    prerequisites: "causal LM、EOS/hidden state、LoRA/对比学习、MTEB；建议先完成通用文本 embedding 训练页"

  code-embedding-retrieval.md:
    level: "代码 Embedding · 推荐精读"
    effort: "建议投入：90–150 分钟，按 function→repo 画粒度与候选账"
    background: "代码既是 token 序列，也是有语法、AST、data-flow、调用关系和文档意图的程序；普通文本相似度无法自动保留这些对象。"
    problem: "从 CodeSearchNet、CodeBERT、GraphCodeBERT、UniXcoder 到 CodeRetriever，比较 function-doc/code-code 对齐、结构特征、正负例、hard negative 与检索评测。"
    legacy: "CodeSearchNet 的 function-doc proxy 和预选候选池限制了外推；AST/data-flow 会增加 token 与索引成本；private repo 的跨文件、版本、构建/执行语义仍未被这些基准完整覆盖。"
    team: "微软 CodeBERT/GraphCodeBERT/UniXcoder、CodeRetriever 学术团队与 CodeSearchNet 社区数据工作；正式身份、模型卡和代码快照分开核验。"
    impact: "建立代码检索的最小审计合同：粒度、语言、结构、正负例、repo/time split、candidate pool、执行验证与 Recall/MRR/nDCG。"
    value: "对代码库搜索、API retrieval、duplicate/bug linking 直接有用：能判断何时加 data-flow/AST，何时应改 candidate split 或 reranker，而不是只换更大模型。"
    strategy: "先读 CodeSearchNet pp.2–6，再选读 CodeBERT pp.2–8、GraphCodeBERT pp.2–9、UniXcoder pp.2–8、CodeRetriever pp.2–8；用 private-repo 时间切分和执行验证反问每个 headline。"
    prerequisites: "tokenization/Transformer、对比学习、基础 AST/data-flow、Recall@K/MRR/nDCG"

  late-interaction-multivector-retrieval.md:
    level: "检索架构桥 · 推荐精读"
    effort: "建议投入：90–150 分钟，并画索引/查询状态图"
    background: "单向量双塔可缓存 passage，却会在 query 到来前把全部 token 压成一点；cross-encoder 保留深层 token 交互，却要为每个候选重新运行 Transformer。"
    problem: "用 ColBERT/ColBERTv2 理解 late interaction：分别编码 token 向量、以 MaxSim 延迟交互、用两阶段 ANN 检索，并把质量监督与多向量压缩拆成两条路径。"
    legacy: "多向量 index、加载和 token-level scoring 比单向量昂贵；MaxSim 丢掉非最大匹配与深层联合交互；候选近似、teacher 偏差、false negatives 和跨 family tuning 仍限制结论。"
    team: "ColBERT 由 Stanford DAWN 的 Khattab/Zaharia 提出并发表于 SIGIR 2020；ColBERTv2 由 Stanford 团队扩展并发表于 NAACL 2022。"
    impact: "late interaction 成为 dense retrieval 中连接 bi-encoder 效率与 token-level matching 的重要系列，影响现代检索、RAG retriever 和多向量索引设计。"
    value: "对知识库工程直接有用：能比较一篇一个向量与一篇一组向量的召回、存储、刷新和 P99 成本，不会把 embedding 模型名当完整索引 ABI。"
    strategy: "先手算两 query token 的 MaxSim，再画 offline centroid/residual 与 online candidate/refinement；亲读 ColBERT pp.2、4–9 和 ColBERTv2 pp.3–10、17，重点看速度合同、非支配结果与限制。"
    prerequisites: "先读 SBERT/SimCSE 的 cross/bi 图；熟悉点积、max/sum、ANN、Recall@K，DPR 可在本页之后对照"

  arxiv-1910.10683.md:
    level: "预训练目标 · 推荐精读"
    effort: "建议投入：120–180 分钟，抓三种 target population 与 UL2 反例"
    background: "NLP 预训练方法的目标、架构、数据和迁移方式繁多，结果难横向比较；任务往往使用不同输出头和训练流程。"
    problem: "先用 BART 接起 bidirectional encoder 与 causal decoder，再用 T5 比较全文与短 span target，最后用 UL2 追问单一 denoiser 怎样扩成 R/S/X mixture 与训练过的 mode 接口。"
    legacy: "统一文本接口不代表任务语义相同；BART/T5/UL2 的 target population、复制压力、mixture 权重与 decoder compute 不同，objective 排名随任务、模型、数据和 mode 变化。"
    team: "BART 来自 Facebook AI并发表于 ACL 2020；T5 来自 Google Research并发表于 JMLR；UL2 来自 Google 团队，本页只按 arXiv 2205.05131v3 表述。"
    impact: "BART 固化通用 denoising seq2seq；T5 的 text-to-text/短 span target影响统一任务框架；UL2 将目标 mixture 和 mode control 变成后续可审计分支。"
    value: "帮你把 encoder/decoder 可见性、corruption、完整/短/混合 target、label 位置与任务格式连起来，并能识别 mode token 和目标配比的训练 ABI。"
    strategy: "先读 BART pp.1–5，再读 T5 pp.8–13、21–24；最后只读 UL2 pp.8–10、15–17、24，保留 extreme-only、50% S 与 purification 反例。"
    prerequisites: "encoder–decoder Transformer、teacher forcing、预训练与微调"

  arxiv-2005.14165.md:
    level: "规模化里程碑 · 推荐精读"
    effort: "建议投入：90–150 分钟，重点读 in-context learning 证据"
    background: "预训练模型通常依赖针对任务的梯度微调；规模增长是否能让模型仅从 prompt 中识别任务，当时仍缺少系统证据。"
    problem: "检验大规模自回归语言模型能否在零样本、单样本和少样本提示下完成多类任务，而无需更新参数。"
    legacy: "上下文学习不保证可靠推理或事实性；训练数据污染、偏见、成本、prompt 敏感性和真实可复现性都是显著问题。"
    team: "Brown 等人的 OpenAI 团队工作，GPT-3 论文发表于 NeurIPS 2020。"
    impact: "将 scaling 与 in-context learning 推到研究和产业中心，直接促成大模型 API、prompting 与通用基础模型浪潮。"
    value: "帮助你区分参数学习与上下文内条件行为，并学会审视规模论断、任务污染和 few-shot 协议。"
    strategy: "精读实验协议、规模趋势和限制；任务逐项结果可抽样读。不要把演示成功直接外推成稳定能力。"
    prerequisites: "自回归语言模型、few-shot evaluation、基本 scaling 概念"

  arxiv-2204.02311.md:
    level: "系统化案例 · 定向精读"
    effort: "建议投入：75–120 分钟；做预训练时提高优先级"
    background: "超大模型能力不仅取决于参数量，还依赖数据混合、并行系统、训练稳定性与评测；单一架构描述无法解释完整训练工程。"
    problem: "展示 540B dense Transformer 如何在 Pathways 系统上训练，并系统评估规模带来的跨任务能力与局限。"
    legacy: "训练数据、成本和实现并不完全可复现；规模收益仍伴随偏见、记忆、毒性、推理不稳定和高服务成本。"
    team: "Google Research / Pathways 团队的大型协作项目，由 Chowdhery 等人报告。"
    impact: "PaLM 是超大 dense 模型时代的重要系统与能力报告，也推动了对 scaling、emergent behavior 和训练基础设施的讨论。"
    value: "让你把模型架构、数据、并行、硬件、稳定性和 benchmark 当成一份共同实验合同，而不是孤立模块。"
    strategy: "首遍只读规模、数据和评测，把并行与稳定性章节标记为阶段 3 后二刷；重点识别哪些结果能归因、哪些不能。"
    prerequisites: "Transformer、规模与预训练评测；数据并行/模型并行在下一阶段补齐"

  arxiv-2302.13971.md:
    level: "开源路线经典 · 推荐精读"
    effort: "建议投入：60–100 分钟，重点读数据—参数权衡"
    background: "研究通常追求给定训练算力下的最优模型，但部署者更关心在长期推理预算下，较小模型能否靠更多数据获得更好性价比。"
    problem: "训练一组相对较小但数据更充足的基础模型，在控制推理成本的同时达到有竞争力的性能，并开放研究使用。"
    legacy: "训练语料治理、许可证、事实性、对齐和安全仍未解决；小模型多训练也不意味着任意任务或服务成本都更优。"
    team: "Touvron 等人的 Meta AI / FAIR 团队工作，LLaMA 1 开启了后续 Llama 系列。"
    impact: "显著推动高质量开放权重 LLM 生态，并强化了 inference-optimal 与 compute-optimal 目标不同的工程认识。"
    value: "训练你从生命周期总成本看模型大小和 token 数，而不是只看参数量；也适合学习数据配方的审计方式。"
    strategy: "精读训练规模、数据混合和评测边界；具体榜单数字不必记，关注比较是否公平。"
    prerequisites: "causal LM、scaling laws、基本 benchmark 与推理成本概念"

  llama1-llama2-llama31-lineage.md:
    level: "现代模型谱系 · 推荐精读"
    effort: "建议投入：2–3 小时，先画两只时钟再选读原文"
    background: "LLaMA 1 已有独立精读，但 Llama 2 与 Llama 3.1 的偏好数据、奖励模型、拒绝采样、PPO、DPO、长上下文和多轮数据刷新原本散落在不同专题中。"
    problem: "区分一次参数更新的内层梯度时钟与跨 checkpoint 重采数据的外层刷新时钟，解释固定目标的 SFT/DPO 为什么也能处在持续更新的数据飞轮里。"
    legacy: "三代同时改变模型规模、数据、上下文、训练阶段和评测，缺少把所有变量逐项隔离的完整对照；历史样本回放、DPO/PPO 选择与长上下文保留结论都只能在论文给定条件下解释。"
    team: "Meta AI / FAIR 的 LLaMA 1、Llama 2 与 Llama 3.1 三份相邻 arXiv 技术报告综合；本页是系列学习入口，不声称它们具有统一的正式会议身份。"
    impact: "这条谱系把基础模型的生命周期成本、聊天模型的偏好闭环和 405B/128K 的多轮后训练连在一起，是理解现代数据飞轮的代表案例。"
    value: "读完后应能判断样本来自最新模型是否等于策略梯度、奖励模型选择是否反向传播、历史数据为什么要回放，以及 128K 能力为什么可能在 SFT 后退化。"
    strategy: "先做 RM 选优加交叉熵的构造手算，再画内层梯度与外层数据两只时钟；正文重点读 Llama 2 的 RS/PPO 分叉、Llama 3.1 的六轮 RS-SFT+DPO 和长上下文反例。"
    prerequisites: "LLaMA 1、监督微调、奖励模型、PPO、DPO，以及长上下文的基本概念"

  scaling-kaplan-chinchilla.md:
    level: "训练决策地基 · 深度精读"
    effort: "建议投入：90–150 分钟，并做一次预算计算"
    background: "模型、数据和训练算力都能降低 loss，但资源有限；早期大型模型常在参数规模很大时使用相对不足的数据。"
    problem: "用经验幂律描述 loss 随参数、数据和算力变化，并推导固定训练预算下模型大小与 token 数如何分配。"
    legacy: "幂律只在观测分布和规模区间内成立；数据质量、重复、多 epoch、下游能力、推理成本和新架构会改变最优点。"
    team: "综合 OpenAI 的 Kaplan scaling laws 与 DeepMind 的 Chinchilla / compute-optimal training 工作。"
    impact: "改变了业界训练预算分配方式，并促使许多模型从‘参数优先’转向更充分的数据训练。"
    value: "让你能对训练计划提出数量级正确的问题：预算、参数、token、FLOPs 和目标究竟如何绑定。"
    strategy: "精读假设、拟合变量、最优条件和反例；亲手代入一个预算。不要把 C≈6ND 当成跨架构定律。"
    prerequisites: "对数、幂律、训练 FLOPs、validation loss 与简单优化"

  tokenization-data-curation.md:
    level: "数据地基 · 深度精读"
    effort: "建议投入：90–150 分钟，结合自己的数据流程"
    background: "同一模型和 loss 在不同 tokenizer、采样 mixture、去重、过滤与 packing 下，实际看到的训练分布和 token 预算会显著变化。"
    problem: "解释 tokenizer 与数据策展怎样改变样本权重、序列边界、计算分配、污染风险与最终能力。"
    legacy: "高质量、代表性与安全目标常互相冲突；过滤器会带入偏差，去重和污染检测也无法证明语义独立。"
    team: "跨越 SentencePiece、BPE 及多家 LLM 团队的数据工程实践，是综合专题而非单一论文。"
    impact: "这些环节往往比小型架构改动更影响模型质量，却因数据不可公开而长期缺乏同等透明度。"
    value: "对知识工厂尤其直接：你会知道语料选择、切分、去重和 packing 都是在重新定义训练实验，而非简单预处理。"
    strategy: "先把 `A中` 走成 Unicode 码点、UTF-8 bytes、BPE 初始符号、token IDs 和 embedding rows，再重算页面的 `2:1 -> 8:1` 监督权重；算法历史可略读，最后对照自己的 pipeline 产出数据审计清单。"
    prerequisites: "只需先会字符串、整数 ID 和语言模型训练样本；字符/Unicode/UTF-8 byte/BPE 的边界由首个算例重新建立，不把它们当成你已经掌握的前置"

  adam-adamw.md:
    level: "优化地基 · 精读"
    effort: "建议投入：60–100 分钟，并手算前两步"
    background: "不同参数的梯度尺度、稀疏性与噪声不同，单一 SGD 步长难兼顾；把 L2 项直接加入自适应梯度又会改变其收缩语义。"
    problem: "Adam 用梯度一阶和平方梯度矩进行逐参数预条件；Adafactor 把矩阵二阶状态因子化以降低 persistent memory；AdamW 再把权重衰减从自适应 loss-gradient path 中解耦。"
    legacy: "收敛与泛化不由优化器名字保证；epsilon、状态精度、schedule、clip、参数排除和分布式 reduction 仍会改变真实更新。"
    team: "Adam 由 Diederik Kingma、Jimmy Ba 提出；Adafactor 由 Noam Shazeer、Mitchell Stern 提出并发表于 ICML 2018；AdamW 由 Ilya Loshchilov、Frank Hutter 提出，分别成为 ICLR 经典工作。"
    impact: "AdamW 已成为 Transformer/LLM 训练最常见的优化器基线之一，其状态与显存成本也塑造了训练系统设计。"
    value: "帮你从逐元素状态更新理解 optimizer，而不是背默认超参；排查训练不稳、复现实验或估算显存时都直接有用。"
    strategy: "先把 `theta/g/m/v/t` 五个对象放进同一两维参数更新，手算首步 bias correction；再把 L2 的 `lambda*theta -> gradient -> m/v` 与 AdamW 的独立参数收缩画成两条线。Adafactor 和旧实验二刷。"
    prerequisites: "完成公式桥的一步参数更新即可；只需知道 `theta` 是可训练数字集合、gradient 指向局部变化，EMA、正则项、L2 与 weight decay 会从同一数值例重新解释"

  arxiv-2106.09685.md:
    level: "微调核心 · 精读"
    effort: "建议投入：60–100 分钟，重点做参数与显存账本"
    background: "为每个任务完整微调和保存大模型成本很高；adapter 等方法降低可训练参数，却可能引入额外层或推理延迟。"
    problem: "冻结预训练权重，只学习低秩增量矩阵，以较少可训练参数适配下游任务，并可在推理前合并回原权重。"
    legacy: "低秩是否足够依赖任务与注入位置；trainable parameter 少不等于 activation、optimizer、量化或分布式总成本同比下降。"
    team: "Hu 等人的 Microsoft 研究团队工作，发表于 ICLR 2022。"
    impact: "LoRA 成为大模型微调事实标准组件，并催生 QLoRA、众多 adapter 生态和多租户模型服务方式。"
    value: "适合你的实际训练工作：能看懂 rank、scaling、注入层和 merge 语义，并正确估算省下的到底是哪类资源。"
    strategy: "精读低秩参数化、梯度路径、参数/显存账本和消融；任务榜单略读。最好用一个线性层写出 shape。"
    prerequisites: "线性层、矩阵秩、反向传播、优化器状态"

  peft-adapters-prefix-prompt-qlora.md:
    level: "方法选型 · 定向精读"
    effort: "建议投入：75–120 分钟，按需求做对照表"
    background: "完整微调成本高，研究者从网络内部模块、attention 前缀、输入 embedding、低秩权重与量化底座等不同位置寻找轻量适配。"
    problem: "统一比较 Adapter、Prefix、Prompt、LoRA、QLoRA 的可训练对象、表达位置、梯度路径、内存和服务行为。"
    legacy: "方法优劣依赖模型规模、任务、batch、序列长度和实现；参数百分比无法单独预测质量、峰值显存或吞吐。"
    team: "综合 Google、Microsoft、University of Washington 等多团队的 PEFT 研究线，不对应单一论文。"
    impact: "构成当代开源微调工具链的主要方法谱系，使单卡适配和多 adapter 部署成为常见实践。"
    value: "帮助你根据约束选方法，而不是因为流行就选 LoRA；尤其能区分参数效率、训练内存和推理成本。"
    strategy: "先读总对照和资源账本，再按当前任务深挖一种方法；无需把所有变体同等精读。"
    prerequisites: "Transformer、attention/KV、LoRA、量化与训练显存基础"

  megatron-zero.md:
    level: "训练系统 · 定向深读"
    effort: "建议投入：90–150 分钟；不做大规模训练可浏览"
    background: "模型参数、梯度、优化器状态和 activation 超出单卡容量；普通 data parallel 会复制大部分状态，单靠增加 GPU 不能自动扩展。"
    problem: "Megatron 用张量/流水线等模型并行拆计算，ZeRO 在数据并行组中分片 optimizer、gradient 和 parameter ownership。"
    legacy: "分片会引入通信、重物化、bucket/prefetch 和拓扑依赖；‘能放下’不等于 step 快、扩展效率高或可稳定恢复。"
    team: "Megatron-LM 主线来自 NVIDIA；ZeRO 来自 Microsoft Research / DeepSpeed 团队。"
    impact: "两条路线共同奠定超大模型分布式训练的核心术语、状态账本与工程实现。"
    value: "让你能精确回答‘切了什么、何时聚合、谁持有状态’，避免只会按 ZeRO stage 或并行缩写选配置。"
    strategy: "先读 GPipe pp.2–5，手画 `K stages × M micro-batches`、rematerialization 与 bubble；再按 parameter/gradient/state/activation 四本账精读，画出一次 forward-backward-update；性能数字只看实验条件。"
    prerequisites: "data parallel、all-reduce、Transformer 参数构成、训练 step"

  training-numerical-stability.md:
    level: "训练工程 · 深度精读"
    effort: "建议投入：90–150 分钟，产出运行手册"
    background: "大规模低精度训练会把初始化、归一化、softmax、reduction、optimizer state、loss scaling 与故障恢复的微小差异放大。"
    problem: "建立 precision map 与稳定性审计框架，解释 overflow、underflow、loss spike 和不可恢复状态怎样产生及如何定位。"
    legacy: "不存在跨模型通用的单一稳定配方；更高精度和更多监控增加成本，恢复策略也可能掩盖根因或改变训练轨迹。"
    team: "综合多家大模型团队和训练框架的论文与固定工件，是跨来源工程专题。"
    impact: "这类知识决定大模型训练能否真正跑完，虽然引用声量不一定像架构论文，却具有极高实践影响。"
    value: "对训练和调参直接有用：你会把 dtype、归约、clip、step、checkpoint 和异常恢复写进实验 identity。"
    strategy: "精读 precision map、失败链和验收卡；结合自己的日志与框架逐项核对，不必记历史模型的每个超参。"
    prerequisites: "浮点数、mixed precision、AdamW、分布式 reduction、训练日志"

  arxiv-1707.06347.md:
    level: "强化学习基础 · 定向精读"
    effort: "建议投入：90–150 分钟；做 RLHF 前必读"
    background: "policy gradient 可用采样轨迹优化策略，但多次复用旧轨迹会产生分布偏移；TRPO 的信赖域约束实现复杂。"
    problem: "用 clipped probability ratio 等简单 surrogate 限制策略单次更新幅度，在样本复用和训练稳定之间折中。"
    legacy: "clip 不是严格信赖域保证；advantage、value、采样策略与实现细节会改变优化，迁移到 token-level LLM 后问题更多。"
    team: "Schulman 等人的 OpenAI 团队工作，发表于 2017 年。"
    impact: "PPO 长期成为深度强化学习和早期 RLHF 的主力基线，影响 InstructGPT 等大模型对齐流程。"
    value: "帮你读懂 pi_old、ratio、advantage、value 和 clip 各自做什么，并避免把 PPO 简化成一个 loss 名称。"
    strategy: "精读概率比的符号分段、采样—更新时序和 value/GAE；机器人与 Atari 表格可浏览。"
    prerequisites: "softmax、对数、梯度更新；读过公式阅读桥即可，策略梯度、advantage 和 importance ratio 本页从两动作数值例开始"

  neurips-2022-instructgpt.md:
    level: "后训练地基 · 深度精读"
    effort: "建议投入：2–3 小时，画清三阶段数据与梯度"
    background: "更大的预训练模型仍可能不遵循用户意图、产生不真实或有害文本；纯 next-token loss 与人类偏好之间存在目标差距。"
    problem: "用示范数据做 SFT、偏好比较训练 reward model，再以 PPO 和 KL 约束优化 policy，使模型更符合标注者偏好。"
    legacy: "reward model 是可被利用的代理；标注者代表性、成本、偏差、KL 选择、事实性与长期安全都没有根治。"
    team: "Ouyang 等人的 OpenAI 大型协作团队工作，发表于 NeurIPS 2022。"
    impact: "把 RLHF 三阶段流程变成行业范式，并展示较小的对齐模型可在人类偏好上超过更大的原始模型。"
    value: "这是理解聊天模型后训练的坐标系；读完应能区分 SFT model、policy、old policy、reference、RM 和 value。"
    strategy: "精读三阶段样本、目标、梯度接收者和评测；标注流程与限制同样重要。不要只看 PPO 公式。"
    prerequisites: "causal LM、监督微调、PPO、KL divergence、pairwise preference"

  preference-reward-overoptimization.md:
    level: "对齐风险 · 深度精读"
    effort: "建议投入：90–150 分钟，重点读 proxy gap"
    background: "人类偏好难直接作为可微目标，RLHF 用有限比较数据拟合 reward model；策略优化会主动搜索其高分区域。"
    problem: "解释偏好比较如何变成 scalar reward，以及 policy 为什么会放大奖励模型误差并产生 reward overoptimization。"
    legacy: "更好的 RM、KL 或在线数据只能缓解而非证明真实目标一致；分布外行为、评审偏差和可扩展监督仍是开放问题。"
    team: "综合 OpenAI、Anthropic 及多所研究机构关于偏好建模、过优化与宪法式监督的工作。"
    impact: "Goodhart 风险已成为后训练设计的中心问题，直接影响数据刷新、regularization、评测和上线监控。"
    value: "让你不把 reward 上升误当能力上升；设计 DPO/RL、judge 或反馈闭环时，能主动寻找代理被钻空子的路径。"
    strategy: "先读 Stiennon 2020 pp.3–7 的 SFT→pairwise RM→PPO/KL 路径与负结果，再精读 reward 数据、normalization、policy shift 和 proxy/gold 曲线；将每条缓解措施写成有边界的假设。"
    prerequisites: "概率、softmax/交叉熵、基本采样与分布直觉；成对奖励模型和 RLHF 闭环由本页从两轨迹数值例开始"

  process-supervision-test-time-search.md:
    level: "推理验证核心 · 深度精读"
    effort: "建议投入：90–150 分钟；第一次读到可检查性训练后停止"
    background: "CoT 和 self-consistency 能产生多条推理路径，但多数票只聚合最终答案；结果监督也无法指出中间哪一步出错，更多候选还会增加评分器被利用的机会。"
    problem: "比较 ORM 的整题结果监督与 PRM 的逐步过程监督，并说明固定 generator 下的 best-of-N、verifier-guided search 与后续 verifier-reward RL 为什么是不同算法阶段。"
    legacy: "自然语言步骤不保证忠实反映内部推理；PRM 仍受标签来源、步骤边界、分数归约、generator shift 与搜索放大 false positive 影响。"
    team: "Lightman、Kosaraju、Cobbe 等人的 OpenAI 团队工作 Let's Verify Step by Step，并结合后续 test-time compute 研究进行边界审计。"
    impact: "该工作发布 PRM800K 并推动过程奖励模型成为数学推理验证和测试时搜索的重要基线；其监督与搜索范式也影响后续 reasoning model 训练。"
    value: "帮你把 verifier training、推理时选择和 policy-gradient RL 分开，避免将 best-of-N 的收益误归因于权重更新，也能审计测试时计算是否只是在放大代理漏洞。"
    strategy: "精读固定 generator 的 ORM/PRM 标签、梯度、product/last-step reduction、generator shift 与测试时预算；critique、辩论、AI Control 和弱监督证据转入独立控制评测页。"
    prerequisites: "CoT、自一致性、交叉熵、reward model、采样与 best-of-N"

  scalable-oversight-control-evaluation.md:
    level: "监督与安全系统 · 推荐精读"
    effort: "建议投入：2–3 小时，先画六角色图再选读原文"
    background: "当强模型比单个监督者更懂任务、甚至可能主动误导时，PRM 选候选、弱标签训练、人机协作、辩论、运行时路由和模型审计不再是同一种监督动作。"
    problem: "区分监督、检查与控制三种承诺，明确每种方法的任务人口、产出者、观察者、决策者、梯度接收者和最终统计单位。"
    legacy: "现有证据多依赖有标签任务、人工 model organism、有限攻击人口或模拟高质量审计；正 PGR、judge accuracy 或 control frontier 都不能升级成自然超人模型的安全证明。"
    team: "综合 OpenAI、Anthropic 及合作者关于 Weak-to-Strong、critique assistance、debate、AI Control、Sleeper Agents、Alignment Faking 与 hidden-objective auditing 的固定一手论文。"
    impact: "这条研究线把‘模型分数是否更高’推进到‘弱监督者能否教、有限判断者能否查、蓄意攻击下系统能否控、异常行为能否归因’四个独立工程问题。"
    value: "帮你避免把学生超过老师、辩论更有说服力、监控器分数变好或红队诱发率下降误读为同一种安全进展，并能为高风险 Agent 写出可验收的威胁模型和路由合同。"
    strategy: "先用 `60/70/80` 手算 PGR，再画 honest/attack 两个评测世界；正文重点读 persuasion 反例、exact/near trigger 分离和四层根因审计，原文只按当前风险问题回查。"
    prerequisites: "奖励模型与过优化、过程监督/测试时搜索、PPO，以及通用评测中的 population、judge 和 aggregation 概念"

  neurips-2023-dpo.md:
    level: "偏好优化核心 · 深度精读"
    effort: "建议投入：90–150 分钟，并亲手推导 pair loss"
    background: "标准 RLHF 需要单独训练 reward model、在线采样和 RL 优化，流程复杂且容易不稳定；偏好数据本身已经提供相对信号。"
    problem: "利用 KL-regularized 最优 policy 与隐式 reward 的关系，把偏好优化改写为 policy/reference log-ratio 上的二分类损失。"
    legacy: "它仍依赖偏好模型假设、reference 与数据覆盖；离线训练不能自动纠正分布外行为、噪声偏好或 reward hacking。"
    team: "Rafailov 等人的 Stanford University 团队工作，发表于 NeurIPS 2023。"
    impact: "DPO 大幅简化偏好训练，迅速成为开源与工业后训练的主流基线，并催生大量直接偏好优化变体。"
    value: "它是理解现代 preference tuning 的最佳数学入口；能帮你看懂 beta、reference、chosen/rejected reduction 与实现差异。"
    strategy: "完整精读推导、partition function 相消条件和 loss reduction；实验榜单次要，必须用最小 pair 手算梯度方向。"
    prerequisites: "交叉熵、Bradley–Terry、KL regularization、causal LM log probability"

  instruction-cot-self-consistency.md:
    level: "推理接口 · 推荐精读"
    effort: "建议投入：75–120 分钟，区分训练、提示与解码"
    background: "模型行为既受训练任务格式影响，也受 prompt 中是否要求中间步骤和推理时是否采样多条路径影响；三者常被混称为‘推理能力提升’。"
    problem: "拆分指令微调、思维链提示与自一致性分别改变的数据、参数更新、当前输出过程和最终答案聚合。"
    legacy: "可读推理链不保证忠实因果过程，多样采样增加成本；多数一致也可能稳定地聚合到错误答案。"
    team: "综合 Google Research 等团队关于 FLAN、Chain-of-Thought 与 Self-Consistency 的多项工作。"
    impact: "这些方法塑造了指令模型、reasoning prompt 与 test-time compute 的基础实践。"
    value: "能帮你在实验中分清能力来自权重更新、上下文示例、显式中间文本还是多样化解码，避免错误归因。"
    strategy: "先手算页面开头同一道题的三条路径：一次监督更新、一次冻结模型的带步骤生成、五次答案投票；再读 FLAN/CoT/self-consistency 证据，现代 Qwen 扩展放到最后。"
    prerequisites: "交叉熵与自回归生成的基本直觉；指令微调、思维链、自一致性和采样均由本页从同一道题开始解释"

  reasoning-rl-reductions.md:
    level: "快速演化前沿 · 定向深读"
    effort: "建议投入：90–180 分钟；仅在做 reasoning RL 时精读"
    background: "推理模型使用同 prompt 多次 rollout 和 outcome reward 训练，但 question、response、token 的权重会被 baseline、标准化、ratio 和 denominator 悄然改变。"
    problem: "统一拆解 GRPO、DAPO、GSPO 等方法的 advantage、importance ratio、clip 与 reduction，揭示同名 trainer 背后的真实优化单位。"
    legacy: "公开方法仍在快速迭代，复现依赖 rollout 系统、数据与 verifier；更长推理、reward exploitation 和训练 population shift 尚未解决。"
    team: "覆盖 DeepSeek、字节跳动、Qwen/阿里等团队及相关开源实现，是快速变化的跨论文专题。"
    impact: "代表 2024–2026 reasoning RL 的重要方法线，但结论成熟度低于 Transformer、PPO 或 DPO 等经典工作。"
    value: "如果你要实现或评审推理 RL，它能防止 denominator、detach、clip unit 等细节在不知不觉中改掉算法。"
    strategy: "先读统一五轴框架，再精读你实际使用的 trainer；逐公式标注 shape、reduction 和 stop-gradient，其他变体只比较。"
    prerequisites: "PPO/DPO、policy gradient、importance sampling、token/sequence reduction"

  dpr-dense-retrieval.md:
    level: "检索地基 · 推荐精读"
    effort: "建议投入：60–100 分钟，并写出 B×B score matrix"
    background: "传统开放域问答依赖稀疏词项匹配，语义改写可能召回失败；端到端生成模型又难在参数中容纳和更新全部事实。"
    problem: "用 question/passages 双编码器和对比式 negative 训练学习 dense retrieval，使语义相近文本可通过向量内积召回。"
    legacy: "召回仍受 negative 分布、语料切分和索引版本影响；dense 并非总胜 BM25，检索正确也不保证 reader 回答或引用正确。"
    team: "Karpukhin 等人的 Facebook AI Research 团队工作，发表于 EMNLP 2020。"
    impact: "DPR 奠定现代 dense retriever 的训练模板，并成为 RAG 与开放域问答系统的重要组件。"
    value: "对知识库搜索直接相关：你会理解 embedding index 的训练目标、in-batch negatives、recall 和最终回答质量为何必须分开评估。"
    strategy: "精读 score matrix、negative 构造、index/retrieval ABI 与 recall 指标；问答榜单浏览即可。"
    prerequisites: "向量检索、softmax cross-entropy、对比学习、top-k recall"

  rag-external-memory.md:
    level: "知识系统地基 · 深度精读"
    effort: "建议投入：90–150 分钟，画清 selector 与 generator"
    background: "参数化语言模型知识难更新、难追溯且容量有限；检索可以在推理时提供外部文档，但选择是离散的，来源也可能不可靠。"
    problem: "把检索文档作为外部记忆，联合建模 retriever 与 generator，并比较 sequence/token 级文档边缘化。"
    legacy: "检索 recall、文档可信度、context consumption、引用归属和联合训练 credit assignment 仍是独立问题；RAG 不自动消除幻觉。"
    team: "核心 RAG 工作来自 Facebook AI Research，并承接 DPR、REALM 等多条检索增强研究线。"
    impact: "RAG 已成为企业知识问答和可更新 LLM 系统的主流架构模式，影响远超原论文的具体实现。"
    value: "与你的 knowledge_factory 高度相关：能帮助你把 candidate generation、payload、generation 与 provenance 分层设计和验收。"
    strategy: "先把一条样本改写成‘找候选 -> 每篇分别生成 -> 路径概率求和 -> 答案损失分配责任’，再手算 RAG-Sequence 与 RAG-Token；最后用工程视角补读 chunk/index/citation 合同。"
    prerequisites: "建议先读 DPR；条件生成、潜变量、边缘化与 top-k 均在本页从两文档算例重新解释"

  inference-serving-quantization.md:
    level: "部署地基 · 深度精读"
    effort: "建议投入：2–3 小时，结合一次实际 profiling"
    background: "LLM 服务瓶颈随 prefill/decode、batch、序列长度和硬件变化；论文常分别优化调度、KV 内存、attention IO、解码串行或数值精度。"
    problem: "统一拆解 token 流、KV cache、continuous batching、PagedAttention、FlashAttention、speculative decoding 与量化分别优化哪个对象，并把 MTP 训练头、proposal、target 校验和 state commit 分开。"
    legacy: "单项论文倍率不能相乘；KV 低位还必须固定 K/V 量化轴、group、scale/zero metadata、近期高精度 residual 与 TP/CP ownership。质量、kernel、队列和 SLO 跨硬件不可直接外推。"
    team: "综合 UC Berkeley/vLLM、Stanford/FlashAttention、Google/DeepMind、Meta、NVIDIA 等多团队系统与算法工作。"
    impact: "覆盖当代 LLM serving 栈的核心思想，决定模型能否以可接受的 latency、throughput 和成本上线。"
    value: "非常适合工程决策：你会知道该测 TTFT、TPOT、吞吐、峰值内存还是质量，以及每项优化真正改变了哪本账。"
    strategy: "按 request→prefill→decode→schedule→kernel→operand 逐层精读；MTP 画 objective→proposal→verify→state commit，KV 量化画 K/V identity→axis/group→metadata→residual→kernel/ownership，再对 workload profiling。"
    prerequisites: "Transformer attention、KV cache、GPU memory hierarchy、batching、基本量化"

  long-context-memory-evaluation.md:
    level: "能力审计 · 推荐精读"
    effort: "建议投入：75–120 分钟，重点读五层合同"
    background: "模型声明的 context window 越来越长，但能接收长输入、稳定运行、找到信息、组合利用信息和在真实任务获益不是同一件事。"
    problem: "建立长上下文的容量、状态、检索、任务利用与评测合同，并比较 recurrence、sparse attention、RoPE 扩展等机制。"
    legacy: "单针检索不能代表多证据推理；位置、信息密度、输出协议和 scorer 都会改变结果，成本随有效长度显著增长。"
    team: "综合 Transformer-XL、Lost in the Middle、RULER 等多团队研究，是跨模型与评测的专题。"
    impact: "为行业从营销式 window 数字转向 effective context 和可复现长文本评测提供了重要框架。"
    value: "做长文档知识处理时尤其有用：它会迫使你分别验证‘放得下、找得到、用得对’，而非只检查 API 是否接受。"
    strategy: "先把 TXL/SWA/full attention、RoPE/YaRN、KV cache、Lost/RULER/MRCR 分别归入连接状态、位置、服务状态和评测四类，再读五层合同与两个数值路径。"
    prerequisites: "建议先读 Transformer 与推理系统；本文会重新解释 KV cache、位置、连接图、训练梯度和有效长度"

  evaluation-effective-context.md:
    level: "通用必读 · 深度精读"
    effort: "建议投入：90–150 分钟，并改造一份评测方案"
    background: "LLM 分数同时受样本 population、prompt、few-shot、decode、parser、judge 与 aggregation 影响；同一模型并不存在脱离协议的单一能力分数。"
    problem: "把 benchmark 分数还原成可重放的观测合同，解释 MMLU、HELM、LLM judge、污染、emergence 与有效上下文中的测量偏差。"
    legacy: "开放任务缺少完美 scorer，judge 也会偏置或被操纵；覆盖率、成本、时效性和现实效度之间仍需取舍。"
    team: "综合 Stanford HELM、MMLU 及多家机构的评测、污染和长上下文研究，不对应单一团队。"
    impact: "评测方法决定模型、训练和产品决策是否可信；它的实践价值不亚于任何单篇模型论文。"
    value: "这是 34 篇里最值得通用工程师精读的专题之一，能显著减少错误榜单比较、指标优化和上线误判。"
    strategy: "精读实验 identity、parser/judge/aggregation 与反例；边读边把你现有评测补齐版本、seed、decode 和失败分类。"
    prerequisites: "基础统计、benchmark、采样解码、precision/recall 与实验设计"

  factuality-calibration-selfcheck.md:
    level: "可靠性专题 · 推荐精读"
    effort: "建议投入：60–100 分钟，重点区分三个概念"
    background: "模型可能生成错误事实、给出不可靠置信度，也可能在多次采样中互相矛盾；这些现象相关却不是同一个可观测量。"
    problem: "区分 factual correctness、probability calibration 与 self-consistency，并解释内部置信、外部证据和多样采样各能检测什么。"
    legacy: "模型可能稳定复述同一错误；低一致性也可能只是合理多样性。没有外部 provenance 时，自检不能提供真值证书。"
    team: "综合 SelfCheckGPT、校准与语言模型事实性等多所高校和产业研究团队的工作。"
    impact: "这些区分影响 hallucination 检测、置信展示、自动评审与 RAG 验收，是可靠 AI 的关键基础。"
    value: "能帮助你为知识问答选择正确指标：是查事实、测置信、看采样一致，还是验证引用，而非用一个 hallucination score 包办。"
    strategy: "精读概念边界和 failure cases；方法细节按当前产品需求选择。为每个指标写明它不能证明什么。"
    prerequisites: "概率、采样、校准、RAG/provenance 基础"

  decoding.md:
    level: "生成地基 · 精读"
    effort: "建议投入：60–100 分钟，并做一组可视化实验"
    background: "语言模型只输出‘下一个词元可能是什么’的条件概率；产品最终显示的文本，还取决于贪心选择、束搜索、温度、候选过滤、长度惩罚、停止规则和结果解析。"
    problem: "解释不同解码算法如何把同一组词元概率变成完整文本，以及搜索范围、随机性、长度偏好、多样性和重复之间怎样权衡。"
    legacy: "搜索更充分不等于更符合业务目标；模型概率与事实正确、用户偏好和任务指标之间存在差距，采样参数也不能补回模型没有学到的知识。"
    team: "综合机器翻译、语言生成与大语言模型在线推理服务的多团队研究，是算法谱系专题而非单一论文。"
    impact: "解码设置直接改变所有生成式评测和线上行为，却经常被当成无关默认值；其工程影响极高。"
    value: "读完你能解释为什么同一份模型权重会给出不同答案，并把完整解码配置纳入实验复现和产品质量控制。"
    strategy: "先重算页面开头 `[.40,.25,.20,.10,.05]` 的贪心、top-k、top-p 归一化，再用 `[3,2,0]` 比较温度；随后读束搜索短输出反例与完整停止合同。"
    prerequisites: "softmax 与条件概率的基本直觉；top-k、top-p、温度和束搜索都由本页从数值例开始解释"

  knowledge-distillation-autoregressive.md:
    level: "专项方法 · 选读"
    effort: "建议投入：60–100 分钟；做模型压缩时精读"
    background: "大模型部署昂贵，教师模型可能通过完整概率、生成响应或交互式反馈向较小学生传递比 one-hot 标签更丰富的信号。"
    problem: "区分 logit distillation、sequence-level KD 与学生前缀上的生成式反馈，明确教师 target、前缀来源和梯度路径。"
    legacy: "学生容量限制、teacher 偏差和 exposure mismatch 仍在；生成 hard response 会丢掉概率信息，在线反馈又显著增加成本。"
    team: "综合 Hinton 等人的经典 KD、Sequence-Level KD 以及后续自回归蒸馏团队的多条研究线。"
    impact: "知识蒸馏是模型压缩与小模型训练的长期基础方法，在 LLM 合成数据与 teacher–student 训练中持续演化。"
    value: "帮你审计‘蒸馏’到底复制了 logits、答案还是轨迹，避免不同算法共享名称却优化完全不同对象。"
    strategy: "先把 Word-KD、SeqKD、GKD 逐一改写成‘前缀由谁产生、教师交付概率还是文本、梯度更新谁’，再重算四词表软目标更新：均匀学生如何从 `[.25,.25,.25,.25]` 向教师 `[.70,.20,.01,.09]` 移动。"
    prerequisites: "softmax 与交叉熵；温度、KL、教师强制和自回归前缀均在本页结合数值路径解释"

  arxiv-2403.05530.md:
    level: "长上下文案例 · 研究选读"
    effort: "建议投入：60–100 分钟；重点审计评测，不必通读"
    background: "长 context window 从几十万扩展到百万级后，API 容量声明需要以跨模态检索、长文理解和实际任务协议验证。"
    problem: "展示 Gemini 1.5 的 MoE 与长上下文能力，并用 needle、长视频/音频和多类任务论证模型可利用超长输入。"
    legacy: "单 needle、特定 prompt 与累计指标不能代表复杂多证据推理；模型、API、数据和 serving 细节也不完全开放。"
    team: "Google DeepMind 的 Gemini 大型协作团队技术报告。"
    impact: "推动百万 token context 成为前沿模型能力指标，也促使社区更严格地区分 window size 与 effective context。"
    value: "适合练习如何审计高影响技术报告：拆分 checkpoint、prompt、retrieval cardinality、scorer、aggregation 和成本。"
    strategy: "读核心架构概览和长上下文评测合同；跳过大量重复 benchmark，重点检查图表分母与任务难度。"
    prerequisites: "MoE、长上下文评测、needle test、基本多模态概念"

  arxiv-2412.19437.md:
    level: "现代系统案例 · 定向深读"
    effort: "建议投入：2–3 小时；做架构/训练/服务时高优先级"
    background: "超大 MoE 模型需要同时控制 attention cache、专家负载、训练吞吐、低精度稳定性和后训练能力，单个组件优化不足以形成可训练系统。"
    problem: "把 MLA、细粒度 MoE、无辅助损失负载均衡、MTP 与 FP8 训练组合成 DeepSeek-V3 的端到端配方。"
    legacy: "组件干净归因有限，训练代码与数据并不完整；V3 sequential MTP 与 ICML independent heads 的条件图不同，公开 demo 又不实现 proposal/verification/rollback；671B 服务成本和跨硬件复现仍是巨大门槛。"
    team: "DeepSeek-AI 大型研究与工程团队的技术报告。"
    impact: "以较完整的架构和训练账本影响了现代开源模型讨论，MLA、MTP、MoE balance 与 FP8 配方尤受关注。"
    value: "它是把现代 block、MoE、训练稳定性与 serving 放在一张计算图上审计的优秀案例，但不应被读成单组件万能证明。"
    strategy: "先拆 MLA/MoE/MTP/FP8 四张账；MTP 处对照 same-prefix independent heads 与 gold-conditioned sequential depth，再沿 proposal→target verification→state commit 检查 serving 缺口。"
    prerequisites: "现代 Transformer、MoE、KV cache、mixed precision、分布式训练"

  qwen2-qwen25-qwen3-lineage.md:
    level: "现代模型谱系 · 推荐精读"
    effort: "建议投入：2–3 小时，先画三代信号路由再选读原文"
    background: "Qwen2、Qwen2.5 与 Qwen3 都有可固定的技术报告，但架构、数据、长上下文、偏好训练和蒸馏证据散落在多个专题中；按模型名进入时，很难看出哪些是沿用、哪些是替换。"
    problem: "用同一条问题—生成—评价—反馈—损失—梯度—刷新流程比较三代，解释现代模型系列的真实演进为什么不能压缩成参数量、上下文长度或 DPO/GRPO 标签。"
    legacy: "三份报告都缺少把架构、数据和各后训练阶段一次只改一个变量的完整消融；数据、trainer、evaluator 与论文 checkpoint 的可复现工件也未完整公开。"
    team: "Qwen Team / Alibaba 的三份相邻 arXiv 技术报告综合；本页是系列学习入口，不声称它们已正式发表于会议或期刊。"
    impact: "Qwen 是重要的开放模型系列；三代报告覆盖现代 decoder、稀疏专家、长上下文、数据飞轮、偏好优化、thinking protocol 与强到弱蒸馏，适合作为系列报告审计范例。"
    value: "读完后应能判断一个代际变化究竟改了 block、样本人口、评价者、反馈类型、loss、梯度接收者还是部署协议，并避免把整模提升归因给一个缩写。"
    strategy: "先做五分钟动作卡和 DPO 四分数手算；正文重点读总表、长上下文五层、三代九格信号路由与三个负结果，再按疑问跳回三份固定 PDF。"
    prerequisites: "Transformer 的 Q/K/V 与 KV cache、causal LM、SFT、DPO、奖励模型，以及 MoE 总参数/激活参数的基本区别"

  deepseek-v2-v3-r1-lineage.md:
    level: "现代模型谱系 · 推荐精读"
    effort: "建议投入：2–3 小时，先画权重与数据两种箭头"
    background: "DeepSeek-V2、V3 与 R1 的固定证据已分布在现代 block、MoE、V3、蒸馏和推理强化学习专题中，但按模型名进入时，容易把报告发布日期、checkpoint 继承和教师数据迁移误画成一条直线。"
    problem: "区分架构/权重继承与行为/数据继承，解释 V2 的高效架构和 GRPO、V3 的内部 R1 数据、R1-Zero 的可验证探索，以及 Qwen/Llama 学生的响应蒸馏怎样组成闭环。"
    legacy: "三份报告同时改变 base、数据、规模、reward、训练阶段和系统，缺少全变量受控对照；R1 训练栈、完整数据、token mask/reduction 和 MTP rollout 接口也未完整公开。"
    team: "DeepSeek-AI 的 DeepSeek-V2、DeepSeek-V3 与 DeepSeek-R1 三份相邻报告综合；R1 有已核对的 Nature 正式身份，但本页机制引用使用固定 86 页 arXiv-v2。"
    impact: "该系列把高效 MoE/MLA 底座、可验证 reasoning RL、拒绝采样数据生产和跨架构小模型迁移放进同一工程链，是理解现代 reasoning model 生产方式的代表案例。"
    value: "读完后应能解释 R1-Zero 为什么不是从零训练、R1-Distill-Qwen 为什么仍是 Qwen 架构、能力怎样沿固定响应而非权重传播，以及无 critic 为什么仍需多模型运行系统。"
    strategy: "先画实线权重箭头和虚线数据箭头，再走 R1-Zero 与完整 R1 流程；用一个学生词元的交叉熵手算确认响应蒸馏的梯度接收者，最后读 direct-RL、reward hacking 和 PRM/MCTS 反例。"
    prerequisites: "DeepSeek-V3 单篇、MoE、MLA/KV cache、SFT、GRPO、拒绝采样和自回归知识蒸馏"

  agentic-rl-credit-assignment.md:
    level: "Agentic RL 主线 · 机制精读"
    effort: "建议投入：90–150 分钟，并按问题选读五篇原文"
    background: "普通 outcome-level RL 把整条长轨迹的最终成败广播给许多 token；工具调用、重复状态、环境 step 和可分支 sandbox 让 credit 的自然单位不再相同。"
    problem: "比较 GiGPO、StepPO、RewardFlow、TRACE 与 BPO 如何分别把 credit 对齐到 repeated state、environment step、state graph、turn 或 sandbox sibling，并核对 advantage/ratio 的真实归约对象。"
    legacy: "这些方法依赖不同的 state identity、gold answer、graph merge、snapshot 和计算预算；它们不是一条无条件升级链，也都没有证明一般因果 credit。"
    team: "综合 NTU/Skywork、USTC、HKBU/TCL、Microsoft Research/UW 和 MBZUAI/McGill 等团队的 2025–2026 原始工作；逐篇成熟度与限定证据置信度分别记录。"
    impact: "把 Agentic RL 的核心争论从‘有没有 step reward’推进到 credit object、可用反事实信息和环境成本的可审计比较。"
    value: "读完能判断 reward/advantage 究竟在 trajectory、state、step、turn 还是 branch 上有语义，并为具体 harness 选择可实现方法。"
    strategy: "先用一条五步 tool trajectory 标注五种 credit，再读统一矩阵；选读 GiGPO pp.4–8、StepPO pp.4–10、RewardFlow pp.3–11，TRACE/BPO 只在 gold-answer 或 sandbox branching 命中时深入。"
    prerequisites: "PPO、GRPO、advantage、MDP state/action 和基本 agent tool loop"

  evaluator-judge-validity-cua.md:
    level: "Agentic RL 测量主线 · 必读"
    effort: "建议投入：60–90 分钟，并手画一次 scorer disagreement 矩阵"
    background: "Agent benchmark 的 success/fail 会被任务版本、环境状态、合法替代轨迹、脚本 oracle 和 VLM judge 共同改变；如果 verdict 本身不可靠，reward、checkpoint 选择和能力结论都会对错对象。"
    problem: "把 CUA 分数还原成 task、environment、trajectory、scorer 与 aggregation 的测量管线，并用 PASS/FAIL 分层复核、human-gold、hard set、校准和成本审计 judge。"
    legacy: "150 条公开 FAIL 的 15.3% 误判不能外推全部 CUA；OSReward 的 1,019 条 human-gold 和 284 条 hard trajectories 也不能证明任意 judge、平台或生产任务可靠。"
    team: "综合 2026 年 How Benchmarks Mis-Score Computer-Use Agents 与 OSReward 两篇 arXiv 预印本；当前没有正式接收或独立复现证据。"
    impact: "它把 evaluator 从训练后的报表组件提升为 reward、数据筛选和 checkpoint selection 的共同测量接口，补齐现有 Agentic RL 主线缺失的 scorer validity。"
    value: "设计 Agent 训练或评测时，你会同时保存分母、环境版本、轨迹证据、误判方向、校准与人时，不再把单一 success rate 当成能力真值。"
    strategy: "先画 task→environment→trajectory→script/human/judge→aggregate 流程，再重算 150 条 FAIL 审计的分母；重点读两篇论文的 hard-set、false-success、成本与外推边界。"
    prerequisites: "Agent tool loop、success rate、混淆矩阵与置信区间直觉；先读通用评测页更顺畅"

  agentic-rl-capability-failures.md:
    level: "Agentic RL 反证主线 · 必读"
    effort: "建议投入：75–120 分钟，并重算一个 PASS@(k,T) 例子"
    background: "pass@1 上升可能只把基础 policy 已经偶尔采到的行为变得更常见；reward 突降也可能是 tool-control token/serialization 崩溃，而不是所有语义能力消失。"
    problem: "用 PASS@(k,T)、greedy-vs-sampled headroom、controlled null 与 control-token trace 区分可靠性提升、有限预算下的观测边界扩张和接口崩溃。"
    legacy: "有限 n 下 0 次成功不证明真实概率为零；MiniWoB、小检索环境和小模型负结果不能外推到所有代码、搜索或大模型 Agent。"
    team: "综合 Fudan/CUHK/Waterloo 的 PASS@(k,T)、多机构的 GRPO controlled null，以及 CAS/UCAS 的 tool-use collapse 研究。"
    impact: "为 Agentic RL 增益和失败主张增加最小统计/接口反证，避免把单一 reward 或 pass@1 曲线写成能力结论。"
    value: "训练前可先测 policy distribution 是否有 headroom；训练后能用 k/T、新增/丢失题和格式有效率定位提升或崩溃发生在哪一层。"
    strategy: "先算 n=64 下 0/1/8 successes 的含义，再走 sampled-vs-greedy 诊断；选读 PASS pp.3–9、LR failure pp.1–6、collapse pp.2–9。"
    prerequisites: "GRPO、pass@k、采样温度、SFT 和工具调用控制 token"

  agentic-rl-environments-systems.md:
    level: "Agentic RL 系统主线 · 系统精读"
    effort: "建议投入：90–150 分钟；准备训练时按审计清单逐项核验"
    background: "Agentic RL 的 action 不只是文本：环境 state/reset、verifier、harness protocol、exact tokens、old log-prob、policy version 和 MoE route 共同决定一个 rollout 是否仍是算法声称的样本。"
    problem: "比较 CUA-Gym、OpenWebRL、Polar、Molt 与 rollout infrastructure tax，解释 executable environment、native harness、token provenance、异步 correction 和真实成本。"
    legacy: "大厂技术报告和开源框架提高可审计性，却不等于同行评审或独立复现；live Web、synthetic verifier、单 backend 和 vendor benchmark 都限制外推。"
    team: "综合 HKU/Qwen/Alibaba、UIUC/Microsoft Research、NVIDIA NeMo 与系统基础设施团队的 2026 工作。"
    impact: "把 rollout engineering 提升为算法正确性问题：retokenization、staleness 或 MoE route mismatch 都可能让 policy ratio 对错对象。"
    value: "适合设计训练 ABI、排查 reward/throughput 异常，并避免把模型 forward 速度当完整 Agentic RL 成本。"
    strategy: "先为一次 rollout 列 exact token/action span/log-prob/policy-version/state/verifier 六本账；选读 CUA-Gym pp.1–10、Polar pp.2–10、Molt pp.3–10。"
    prerequisites: "Agent tool loop、PPO/GRPO、tokenization、同步 rollout provenance；异步 staleness 由下一页建立，MoE routing 基础有帮助"

  async-staleness-rolloutpipe.md:
    level: "Agentic RL 系统进阶 · 进阶精读"
    effort: "建议投入：60–90 分钟，并画 policy/version/route 三条时钟"
    background: "rollout 与 trainer 解耦可以减少等待，却让 behavior policy、current policy、推理 engine 和 MoE route 产生不同步；配置的 step lag 不能直接表示 sampled action 的真实 mismatch。"
    problem: "区分 per-token sampled log-ratio tail、SAT 的单侧自适应 clip、R3 routing replay 与 RolloutPipe complete-group 调度，审计异步吞吐是否仍保持目标函数语义。"
    legacy: "SAT 的 Qwen3-30B-A3B/AIME24 lag 1/8 网格每格只有单 seed；RolloutPipe 的 wall-clock overlap 也不是能力增益，两者都不是普适异步 RL 定律。"
    team: "综合 Stale but Stable 与 RolloutPipe 两篇 2026 arXiv 预印本；前者有作者项目页，后者尚无已固定官方代码仓库。"
    impact: "它把 policy lag 从平均系统标签改成 sampled-token mismatch 与 route provenance，并把调度提速和 stale correction 分成两个可观测接口。"
    value: "排查异步 RL 崩溃时，你能分别查看 log-ratio tail、有效更新 token、route replay、weight round 和 trainer idle，而不是只比较平均 lag 或吞吐。"
    strategy: "先为同一 token 记录 behavior/current log-prob、policy version 和 route，再画 SAT 与 R3 的作用面；最后用 complete group 检查 RolloutPipe 只优化调度、不改变 objective。"
    prerequisites: "PPO/GRPO ratio 与 clip、old/current policy、异步 rollout；MoE route 和 complete group 基础"
