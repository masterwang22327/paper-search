name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install validation dependencies
        run: python -m pip install 'PyYAML>=6.0' 'jsonschema>=4.0'
      - name: Run unit tests
        run: python -m unittest discover -s tests -q
      - name: Compile core modules
        run: python -m py_compile tools/research_runtime.py tools/validate_library.py reader/server.py
