name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install validation dependencies
        run: python -m pip install -e '.[validation]'
      - name: Run unit tests
        run: python -m unittest discover -s tests -q
      - name: Compile core modules
        run: python -m py_compile tools/research_runtime.py tools/validate_library.py reader/server.py
